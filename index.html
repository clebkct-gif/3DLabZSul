<script>
const $=s=>document.querySelector(s),rad=a=>a*Math.PI/180;
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len:a=>Math.hypot(...a),norm(a){const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l]}};
function ik(a,t,l1,l2,pole){const d=V.sub(t,a),L=Math.max(.05,Math.min(V.len(d),l1+l2-.002)),n=V.norm(d),x=(l1*l1-l2*l2+L*L)/(2*L),h=Math.sqrt(Math.max(l1*l1-x*x,0));let pp=V.norm(V.sub(pole,V.mul(n,V.dot(pole,n))));return[V.add(a,V.add(V.mul(n,x),V.mul(pp,h))),V.add(a,V.mul(n,L))]}
const BASE={p:[0,0,0],hy:0,sy:0,b:.1,l:10,rw:[.2,.1,.35],lw:[-.1,.1,.35],rk:[.2,.5,.85],ra:[.18,.05,0],la:[-.18,.05,0]};
const K=(t,o)=>({t,...BASE,...o});
function clampBio(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function clampVecCone(dir,refDir,maxAngRad){
  const d=V.norm(dir),r=V.norm(refDir);
  const c=V.dot(d,r),minC=Math.cos(maxAngRad);
  if(c>=minC)return d;
  const ortho=V.norm(V.sub(d,V.mul(r,c)));
  return V.norm(V.add(V.mul(r,minC),V.mul(ortho,Math.sin(maxAngRad))));
}
function joints(o){
  // 1. Limites anatômicos da coluna e separação quadril-ombros (X-factor fisiológico <= 62°)
  const hyDeg=clampBio(o.hy,-75,75);
  const xFactor=clampBio(o.sy-hyDeg,-62,62);
  const syDeg=hyDeg+xFactor;
  const leanDeg=clampBio(o.l,-22,38);
  const crouch=clampBio(o.b,-0.04,0.34);

  const pel=[o.p[0],.95-crouch+o.p[1],o.p[2]],hy=rad(hyDeg),sy=rad(syDeg),lr=rad(leanDeg);
  const hv=[Math.cos(hy),0,-Math.sin(hy)],sv=[Math.cos(sy),0,-Math.sin(sy)],fw=[Math.sin(hy),0,Math.cos(hy)];
  const mv=[Math.cos((hy+sy)/2),0,-Math.sin((hy+sy)/2)];
  const M=V.add(pel,[0,.26*Math.cos(lr*.5),.26*Math.sin(lr*.5)]);
  const neck=V.add(M,[0,.3*Math.cos(lr),.3*Math.sin(lr)]);
  const elR=Math.max(0,o.rw[1]-.3)*.07,elL=Math.max(0,o.lw[1]-.3)*.07;
  const SR=V.add(V.add(neck,V.mul(sv,.19)),[0,elR,0]);
  const SL=V.add(V.add(neck,V.mul(sv,-.19)),[0,elL,0]);
  const HR=V.add(pel,V.mul(hv,.1)),HL=V.add(pel,V.mul(hv,-.1));
  const head=V.add(neck,[0,.2*Math.cos(lr),.2*Math.sin(lr)+.02]);

  // 2. Cinemática inversa com polos anatômicos que impedem hiperextensão/torção reversa de cotovelos e joelhos
  const fS=[Math.sin(sy),0,Math.cos(sy)];
  const pR=V.add(V.add(V.mul(sv,.48),[0,-.72,0]),V.mul(fS,-.24));
  const pL=V.add(V.add(V.mul(sv,-.48),[0,-.72,0]),V.mul(fS,-.24));
  const [RE,RW]=ik(SR,V.add(pel,o.rw),.3,.28,pR);

  // 3. Limite fisiológico do punho (desvio radial/ulnar e flexão/extensão <= 78° em relação ao antebraço)
  const forearmR=V.norm(V.sub(RW,RE));
  const rawRk=V.norm(o.rk);
  const d=clampVecCone(rawRk,forearmR,rad(78));

  let lt=V.add(pel,o.lw);
  if(o.lg>0)lt=V.add(V.mul(lt,1-o.lg),V.mul(V.add(RW,V.mul(d,o.lo)),o.lg));
  const [LE,LW]=ik(SL,lt,.3,.28,pL);

  // 4. Joelhos sempre flexionam para frente (nunca hiperestendem para trás)
  const [RKN,RA]=ik(HR,o.ra,.47,.47,V.add(fw,V.mul(hv,.22)));
  const [LKN,LA]=ik(HL,o.la,.47,.47,V.add(fw,V.mul(hv,-.22)));
  const RKH=V.add(RW,V.mul(d,.56)),RKB=V.add(RW,V.mul(d,.3));
  const ft=(A,s)=>[A[0]+fw[0]*s,Math.max(0,A[1]-(s>0?.2:.04)),A[2]+fw[2]*s];
  return{pel,neck,head,SR,SL,HR,HL,RE,LE,RW,LW,RKN,LKN,RA,LA,RKH,RKB,M,mv,hv,sv,gz:[Math.sin(sy*.4),0,Math.cos(sy*.4)],RHD:V.add(RW,V.mul(d,.05)),RTO:ft(RA,.17),LTO:ft(LA,.17),RHL:ft(RA,-.08),LHL:ft(LA,-.08)}
}
const hm=(p0,p1,m0,m1,h,u)=>Array.isArray(p0)?p0.map((_,i)=>hm(p0[i],p1[i],m0[i],m1[i],h,u)):(2*u*u*u-3*u*u+1)*p0+(u*u*u-2*u*u+u)*h*m0+(-2*u*u*u+3*u*u)*p1+(u*u*u-u*u)*h*m1;
const tg=(a,b,dt)=>Array.isArray(a)?a.map((_,i)=>tg(a[i],b[i],dt)):.72*(b-a)/dt;
const cr=(a,b,c,d,u)=>Array.isArray(a)?a.map((_,i)=>cr(a[i],b[i],c[i],d[i],u)):.5*(2*b+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u);
function evalPose(S,t){if(S.hold&&t>=S.hold)return{...S.keys[S.keys.length-2]};const k=S.keys,n=k.length;let i=n-1;for(let j=0;j<n;j++)if(k[j].t<=t)i=j;const t0=k[i].t,t1=i==n-1?S.dur:k[i+1].t,u=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
const g=j=>k[(j+n)%n],T=j=>k[(j+n)%n].t+Math.floor(j/n)*S.dur,r={};for(const key in BASE)r[key]=hm(g(i)[key],g(i+1)[key],tg(g(i-1)[key],g(i+1)[key],T(i+1)-T(i-1)),tg(g(i)[key],g(i+2)[key],T(i+2)-T(i)),t1-t0,u);for(const f of['ra','la']){const a=g(i)[f],b=g(i+1)[f],d=Math.hypot(b[0]-a[0],b[2]-a[2]),o0=f=='ra'?.1:.4,sp=f=='ra'?.55:.6;if(d>.08){const w=Math.min(1,Math.max(0,(u-o0)/sp)),e=w*w*(3-2*w);r[f]=[a[0]+(b[0]-a[0])*e,Math.max(.05,a[1]+(b[1]-a[1])*e)+.14*Math.sin(Math.PI*w)*Math.min(1,d*2.5),a[2]+(b[2]-a[2])*e]}else if(a[1]<.1&&b[1]<.1){const e=u*u*(3-2*u);r[f]=[a[0]+(b[0]-a[0])*e,.05,a[2]+(b[2]-a[2])*e]}}return r}
const S={
fh:{n:'Forehand',dur:2.4,tc:1.25,inb:[.3,.8,4],intro:'Forehand: o golpe de direita. Observe o giro do tronco, a raquete caindo atrás da bola e a finalização sobre o ombro oposto.',
keys:[K(0,{}),K(.5,{hy:38,sy:92,b:.14,l:12,p:[.05,0,-.12],rw:[.4,.2,-.35],lw:[-.3,.4,.4],rk:[.1,.7,-.7],ra:[.25,.05,-.2],la:[-.2,.05,.3]}),K(.95,{hy:25,sy:72,b:.2,l:15,rw:[.35,-.1,-.4],lw:[-.35,.3,.35],rk:[.1,-.4,-.9],p:[.05,0,-.1],ra:[.25,.05,-.2],la:[-.2,.05,.3]}),K(1.1,{hy:20,sy:66,b:.16,l:15,rw:[.35,-.05,-.2],lw:[-.38,.3,.25],rk:[.1,-.2,-.9],p:[0,0,.12],ra:[.24,.05,-.18],la:[-.2,.05,.32]}),K(1.18,{hy:-7,sy:33,b:.14,l:15,rw:[.35,.05,.2],lw:[-.4,.3,.15],rk:[.1,-.21,-.8],p:[0,0,.16],ra:[.23,.05,-.16],la:[-.2,.05,.34]}),K(1.25,{hy:-16,sy:1,b:.12,l:15,rw:[.35,.12,.5],lw:[-.4,.3,.1],rk:[.1,.15,1],p:[0,0,.2],ra:[.22,.05,-.15],la:[-.2,.05,.35]}),K(1.3,{hy:-17,sy:1,b:.1,l:14,rw:[.3,.35,.75],lw:[-.45,.25,0],rk:[-.22,.54,.63],p:[0,0,.22],ra:[.2,.05,-.1],la:[-.2,.05,.36]}),K(1.6,{hy:-32,sy:-52,b:.04,l:8,rw:[-.2,.55,.3],lw:[-.45,.15,-.1],rk:[-.5,-.3,-.6],p:[0,0,.3],ra:[.1,.2,.15],la:[-.2,.05,.4]}),K(2,{hy:-5,sy:-15,rw:[.1,.2,.4],lw:[-.1,.15,.35],rk:[.2,.6,.8],p:[0,0,.1],ra:[.15,.05,.1],la:[-.15,.05,.2]})],
tips:[[0,['HR','HL'],'Posição de espera','Pés afastados, joelhos flexionados e raquete à frente. Peso na ponta dos pés, pronto para reagir.'],[.5,['SR','SL','HR','HL'],'Unit turn (bloco único)','Tronco, ombros e braço giram juntos, assim que a bola sai da raquete do rival. Ombros ~90° e quadril só 30–45°: essa diferença guarda a energia elástica.'],[.95,['RKH','RKN','LKN'],'Queda da raquete','A raquete cai abaixo da bola enquanto os joelhos flexionam. Essa é a fonte da potência e do topspin.'],[1.18,['HR','HL','SR','SL'],'Pelve → tronco (−75 ms)','A pelve atinge o pico de rotação ~75 ms antes do contato e desacelera, passando o momento ao tronco (pico ~57 ms antes). Depois vêm o ombro (+24 ms) e o cotovelo (+35 ms). O timing, mais que a força, separa elite de jovens de alto nível.'],[1.25,['RW','RKH'],'Ponto de contato','Bola na frente do corpo, na altura da cintura. O quadril abre primeiro, depois ombro e braço. Punho firme.'],[1.6,['SL','RW'],'Finalização','A raquete termina sobre o ombro oposto, com o corpo equilibrado e o olhar na zona de contato.'],[2,['RA','LA'],'Recuperação','Volte rápido à posição de espera, com passos curtos, e prepare a próxima bola.']]},
bh:{n:'Backhand 2 mãos',dur:2.4,tc:1.25,inb:[-.3,.8,4],intro:'Backhand de duas mãos. A mão esquerda comanda o golpe, e o ombro direito aponta para a bola no giro.',
keys:[K(0,{}),K(.5,{hy:-50,sy:-85,l:12,p:[0,0,-.1],rw:[-.3,.2,-.2],lw:[-.35,.25,-.05],rk:[-.5,.7,-.5],ra:[.2,.05,.25],la:[-.25,.05,-.15]}),K(.95,{hy:-30,sy:-80,b:.2,p:[0,0,-.1],l:15,rw:[-.25,0,-.4],lw:[-.35,.05,-.3],rk:[-.3,-.3,-.9],ra:[.2,.05,.25],la:[-.25,.05,-.15]}),K(1.1,{hy:-20,sy:-66,b:.16,l:15,rw:[-.25,0,-.15],lw:[-.2,.1,-.05],rk:[-.2,-.2,-.9],p:[0,0,.12],ra:[.2,.05,.28],la:[-.25,.05,-.12]}),K(1.18,{hy:7,sy:-33,b:.14,l:15,rw:[-.25,.08,.25],lw:[-.15,.1,.2],rk:[-.1,-.21,-.8],p:[0,0,.16],ra:[.2,.05,.29],la:[-.25,.05,-.11]}),K(1.25,{hy:16,sy:-1,b:.12,l:15,rw:[-.1,.12,.55],lw:[-.05,.12,.5],rk:[0,.15,1],p:[0,0,.2],ra:[.2,.05,.3],la:[-.25,.05,-.1]}),K(1.3,{hy:17,sy:-1,b:.1,l:14,rw:[-.1,.4,.7],lw:[0,.35,.55],rk:[.22,.54,.63],p:[0,0,.22],ra:[.2,.05,.34],la:[-.25,.05,-.1]}),K(1.6,{hy:32,sy:52,b:.04,l:8,rw:[.3,.55,.3],lw:[.1,.5,.3],rk:[.5,.3,-.6],p:[0,0,.3],ra:[.2,.05,.4],la:[-.2,.15,.1]}),K(2,{hy:5,sy:10,rw:[.1,.2,.4],lw:[-.1,.15,.35],rk:[.2,.6,.8],p:[0,0,.1],ra:[.15,.05,.2],la:[-.15,.05,.1]})],

function vCross(a, b) {
  return [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
}

function rotAroundAxis(v, k, theta) {
  const c = Math.cos(theta), s = Math.sin(theta);
  const kxv = vCross(k, v);
  const kdv = V.dot(k, v);
  return V.add(V.add(V.mul(v, c), V.mul(kxv, s)), V.mul(k, kdv * (1 - c)));
}

function drawCapsule3D(a, b, r1, r2, colBase, colDark, colLight) {
  const p = proj(a), q = proj(b);
  const dx = q[0] - p[0], dy = q[1] - p[1];
  const len = Math.hypot(dx, dy);
  if (len < 0.5) {
    cx.fillStyle = colBase;
    cx.beginPath(); cx.arc(p[0], p[1], r1 * SCL, 0, Math.PI * 2); cx.fill();
    return;
  }
  const an = Math.atan2(dy, dx);
  const nx = -Math.sin(an), ny = Math.cos(an);
  const R1 = Math.max(1.5, r1 * SCL), R2 = Math.max(1.5, r2 * SCL);

  // Sombra / volume base
  cx.fillStyle = colBase;
  cx.beginPath();
  cx.moveTo(p[0] + nx * R1, p[1] + ny * R1);
  cx.lineTo(q[0] + nx * R2, q[1] + ny * R2);
  cx.arc(q[0], q[1], R2, an + Math.PI / 2, an - Math.PI / 2, true);
  cx.lineTo(p[0] - nx * R1, p[1] - ny * R1);
  cx.arc(p[0], p[1], R1, an - Math.PI / 2, an + Math.PI / 2, true);
  cx.closePath();
  cx.fill();

  // Contorno sutil 3D
  cx.strokeStyle = colDark;
  cx.lineWidth = Math.max(1, SCL * 0.008);
  cx.stroke();

  // Brilho muscular / volumétrico
  if (colLight) {
    cx.strokeStyle = colLight;
    cx.lineWidth = Math.max(1.2, R2 * 0.42);
    cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(p[0] - nx * R1 * 0.35, p[1] - ny * R1 * 0.35);
    cx.lineTo(q[0] - nx * R2 * 0.35, q[1] - ny * R2 * 0.35);
    cx.stroke();
  }
}

function drawJointSphere(P, r, colFill, colRing) {
  const p = proj(P);
  const R = Math.max(2, r * SCL);
  cx.fillStyle = colFill;
  cx.beginPath();
  cx.arc(p[0], p[1], R, 0, Math.PI * 2);
  cx.fill();
  if (colRing) {
    cx.strokeStyle = colRing;
    cx.lineWidth = Math.max(1, R * 0.25);
    cx.stroke();
  }
}

  ].map(proj);
  cx.beginPath();
  hipPts.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
  cx.closePath();
  cx.fillStyle = '#182438';
  cx.fill();
  cx.strokeStyle = '#0f172a';
  cx.lineWidth = 1.5;
  cx.stroke();

  // Camisa atlética (Tronco em V com ombros definidos)
  const P = [
    a(J.pel, J.hv, -0.135),
    a(J.M, J.mv, -0.125),
    V.add(a(J.neck, J.sv, -0.21), [0, -0.02, 0]),
    V.add(J.neck, [0, 0.02, 0]),
    V.add(a(J.neck, J.sv, 0.21), [0, -0.02, 0]),
    a(J.M, J.mv, 0.125),
    a(J.pel, J.hv, 0.135)
  ].map(proj);

  cx.beginPath();
  P.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
  cx.closePath();
  cx.fillStyle = '#1d4ed8';
  cx.strokeStyle = '#1e3a8a';
  cx.lineJoin = 'round';
  cx.lineWidth = Math.max(2, 0.03 * SCL);
  cx.fill();
  cx.stroke();

  // Faixa esportiva diagonal / detalhe na camisa
  const pNeck = proj(J.neck), pPel = proj(J.pel), pM = proj(J.M);
  cx.strokeStyle = '#38bdf8';
  cx.lineWidth = Math.max(1.5, 0.018 * SCL);
  cx.beginPath();
  cx.moveTo(pPel[0], pPel[1]);
  cx.quadraticCurveTo(pM[0], pM[1], pNeck[0], pNeck[1]);
  cx.stroke();
}

function drawHeadRefined(J) {
  const p = proj(J.head);
  const g = proj(V.add(J.head, J.gz));
  const r = 0.105 * SCL;
  const fx = (g[0] - p[0]) / SCL;
  const fy = (g[1] - p[1]) / SCL;
  const facingFront = (g[2] - p[2]) < 0;

  // Cabeça (pele)
  cx.fillStyle = '#e0ac82';
  cx.strokeStyle = '#9c6b43';
  cx.lineWidth = 1.2;
  cx.beginPath();
  cx.ellipse(p[0], p[1], r * 0.86, r * 1.06, 0, 0, Math.PI * 2);
  cx.fill();
  cx.stroke();

  // Cabelo
  cx.fillStyle = '#231710';
  cx.beginPath();
  cx.ellipse(p[0] - fx * r * 0.35, p[1] - fy * r * 0.35 - r * 0.16, r * 0.94, r * 1.0, 0, facingFront ? Math.PI : 0, facingFront ? 0 : Math.PI * 2, facingFront);
  cx.fill();

  // Testeira (Headband esportiva branca)
  if (facingFront) {
    cx.fillStyle = '#ffffff';
    cx.fillRect(p[0] - r * 0.86, p[1] - r * 0.32, r * 1.72, r * 0.22);
    cx.strokeStyle = '#cbd5e1';
    cx.lineWidth = 1;
    cx.strokeRect(p[0] - r * 0.86, p[1] - r * 0.32, r * 1.72, r * 0.22);
  }
}

// Desenha mão anatômica articulada com punho, metacarpo, 5 dedos individuais (3 falanges cada) e juntas
function drawHandWithFingers(wristPos, forearmDir, gripAxis, palmNormal, isRightHand, isTwoHanded) {
  const skin = '#e0ac82';
  const skinDark = '#9c6b43';
  const jointCol = '#facc15'; // Juntas esféricas amarelas de precisão

  // Punho articulado (Wrist joint)
  drawJointSphere(wristPos, 0.028, '#ffffff', '#2563eb');

  // Eixo longitudinal da mão e largura da palma
  const handDir = isRightHand ? gripAxis : V.norm(V.add(forearmDir, [0, -0.1, 0]));
  const sideVec = V.norm(vCross(handDir, palmNormal));
  const palmLen = 0.075;
  const palmCenter = V.add(wristPos, V.mul(handDir, palmLen * 0.55));
  const knucklesBase = V.add(wristPos, V.mul(handDir, palmLen));

  // Palma da mão
  drawCapsule3D(wristPos, knucklesBase, 0.026, 0.032, skin, skinDark, '#f3c69f');

  if (isRightHand) {
    // Mão direita segurando o cabo da raquete com os 5 dedos individuais articulados!
    // Posições dos 4 dedos (Indicador, Médio, Anelar, Mínimo) ao longo do cabo
    const fingerSpecs = [
      { name: 'indicador', offset: 0.048, len: [0.026, 0.020, 0.015], r: 0.0085 },
      { name: 'medio',     offset: 0.028, len: [0.029, 0.022, 0.016], r: 0.0090 },
      { name: 'anelar',    offset: 0.008, len: [0.027, 0.020, 0.015], r: 0.0085 },
      { name: 'minimo',    offset: -0.012, len: [0.021, 0.016, 0.013], r: 0.0075 }
    ];

    fingerSpecs.forEach((f, idx) => {
      // Base do dedo (MCP joint) na lateral do cabo
      const mcp = V.add(V.add(wristPos, V.mul(gripAxis, 0.035 + f.offset)), V.mul(sideVec, 0.022));
      drawJointSphere(mcp, f.r * 1.05, jointCol, skinDark);

      // Falange proximal envolvendo o cabo (curvando em direção a palmNormal)
      const d1 = V.norm(V.add(V.mul(palmNormal, 0.85), V.mul(sideVec, -0.35)));
      const pip = V.add(mcp, V.mul(d1, f.len[0]));
      drawCapsule3D(mcp, pip, f.r, f.r * 0.92, skin, skinDark);
      drawJointSphere(pip, f.r * 0.95, jointCol, skinDark);

      // Falange média fechando o grip
      const d2 = V.norm(V.add(V.mul(sideVec, -0.9), V.mul(palmNormal, 0.2)));
      const dip = V.add(pip, V.mul(d2, f.len[1]));
      drawCapsule3D(pip, dip, f.r * 0.92, f.r * 0.85, skin, skinDark);
      drawJointSphere(dip, f.r * 0.88, jointCol, skinDark);

      // Falange distal (ponta do dedo tocando o outro lado do cabo)
      const d3 = V.norm(V.add(V.mul(palmNormal, -0.75), V.mul(sideVec, -0.45)));
      const tip = V.add(dip, V.mul(d3, f.len[2]));
      drawCapsule3D(dip, tip, f.r * 0.85, f.r * 0.72, skin, skinDark);
    });

    // Polegar opositor (Thumb - 3 articulações: CMC, MCP, IP) fechando por cima
    const cmc = V.add(wristPos, V.mul(sideVec, -0.018));
    drawJointSphere(cmc, 0.010, jointCol, skinDark);
    const tDir1 = V.norm(V.add(V.mul(gripAxis, 0.65), V.add(V.mul(palmNormal, 0.55), V.mul(sideVec, -0.3))));
    const tmcp = V.add(cmc, V.mul(tDir1, 0.025));
    drawCapsule3D(cmc, tmcp, 0.010, 0.0095, skin, skinDark);
    drawJointSphere(tmcp, 0.0095, jointCol, skinDark);

    const tDir2 = V.norm(V.add(V.mul(palmNormal, 0.75), V.mul(sideVec, 0.55)));
    const tipThumb = V.add(tmcp, V.mul(tDir2, 0.022));
    drawCapsule3D(tmcp, tipThumb, 0.0095, 0.0085, skin, skinDark);
    drawJointSphere(tipThumb, 0.0085, jointCol, skinDark);

  } else {
    // Mão esquerda (livre para equilíbrio/toss ou apoiada no cabo no Backhand de 2 mãos)
    const curl = isTwoHanded ? 0.85 : 0.35;
    const fingerOffsets = [-0.022, -0.007, 0.008, 0.022];
    const fingerLens = [0.024, 0.028, 0.026, 0.020];

    fingerOffsets.forEach((off, idx) => {
      const mcp = V.add(knucklesBase, V.mul(sideVec, off));
      drawJointSphere(mcp, 0.0075, jointCol, skinDark);
      const d1 = V.norm(V.add(V.mul(handDir, 1 - curl * 0.5), V.mul(palmNormal, curl)));
      const pip = V.add(mcp, V.mul(d1, fingerLens[idx] * 0.55));
      drawCapsule3D(mcp, pip, 0.0075, 0.0068, skin, skinDark);
      drawJointSphere(pip, 0.0068, jointCol, skinDark);

      const d2 = V.norm(V.add(V.mul(handDir, 0.3 - curl * 0.6), V.mul(palmNormal, 0.9)));
      const tip = V.add(pip, V.mul(d2, fingerLens[idx] * 0.55));
      drawCapsule3D(pip, tip, 0.0068, 0.0058, skin, skinDark);
    });

    // Polegar esquerdo
    const tmcp = V.add(V.add(wristPos, V.mul(handDir, 0.032)), V.mul(sideVec, -0.028));
    drawJointSphere(tmcp, 0.0085, jointCol, skinDark);
    const ttip = V.add(tmcp, V.mul(V.norm(V.add(V.mul(handDir, 0.7), V.mul(palmNormal, 0.5))), 0.028));
    drawCapsule3D(tmcp, ttip, 0.0085, 0.0075, skin, skinDark);
  }
}

function racketDrawRefined(J) {
  const gripAxis = V.norm(V.sub(J.RKH, J.RW));
  let baseNormal = J.RN || [0, 0, 1];
  // Aplica a rotação da empunhadura escolhida (Continental / Eastern / Semi-Western) ao redor do eixo do cabo
  const gripRad = rad(GRIPS[st.grip].ang);
  const n = V.norm(rotAroundAxis(baseNormal, gripAxis, gripRad));
  const w = V.norm(vCross(gripAxis, n));

  const A = 0.165; // Semi-eixo maior da cabeça
  const B = 0.125; // Semi-eixo menor da cabeça
  const C = J.RKH; // Centro da cabeça da raquete
  const throatBase = V.sub(C, V.mul(gripAxis, A * 1.45));
  const handleStart = V.sub(J.RW, V.mul(gripAxis, 0.045)); // Butt cap sobressaindo abaixo do punho

  const M = (x, y) => V.add(C, V.add(V.mul(gripAxis, x), V.mul(w, y)));

  // 1. Butt Cap (base do cabo)
  drawCapsule3D(handleStart, V.add(handleStart, V.mul(gripAxis, 0.022)), 0.022, 0.019, '#111827', '#000000');

  // 2. Cabo (Grip com overgrip branco/preto texturizado)
  drawCapsule3D(V.add(handleStart, V.mul(gripAxis, 0.02)), throatBase, 0.017, 0.016, '#f8fafc', '#475569', '#ffffff');

  // 3. Coração / Garganta (Throat em Y)
  const leftThroat = M(-A * 0.78, -B * 0.58);
  const rightThroat = M(-A * 0.78, B * 0.58);
  drawCapsule3D(throatBase, leftThroat, 0.014, 0.011, '#1e293b', '#0f172a');
  drawCapsule3D(throatBase, rightThroat, 0.014, 0.011, '#1e293b', '#0f172a');
  drawCapsule3D(leftThroat, rightThroat, 0.010, 0.010, '#334155', '#0f172a');

  // 4. Aro e Encordoamento
  const P = [];
  for (let i = 0; i <= 32; i++) {
    const f = (i / 32) * Math.PI * 2;
    P.push(proj(M(Math.cos(f) * A, Math.sin(f) * B)));
  }

  // Fundo translúcido das cordas
  cx.beginPath();
  P.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
  cx.closePath();
  cx.fillStyle = 'rgba(255, 255, 255, 0.22)';
  cx.fill();

  // Cordas verticais (Mains) e horizontais (Crosses)
  cx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  cx.lineWidth = Math.max(0.8, 0.004 * SCL);
  for (const k of [-0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75]) {
    const q = Math.sqrt(Math.max(0, 1 - k * k));
    line(M(-A * q, B * k), M(A * q, B * k), 'rgba(255,255,255,0.75)', cx.lineWidth);
    line(M(A * k, -B * q), M(A * k, B * q), 'rgba(255,255,255,0.75)', cx.lineWidth);
  }

  // Aro externo aerodinâmico
  cx.beginPath();
  P.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
  cx.closePath();
  cx.strokeStyle = '#dc2626';
  cx.lineWidth = Math.max(2.5, 0.018 * SCL);
  cx.stroke();
  cx.strokeStyle = '#1e293b';
  cx.lineWidth = Math.max(1, 0.006 * SCL);
  cx.stroke();

  return { gripAxis, palmNormal: n };
}

function drawPlayer(J, hl) {
  const it = [];
  const shortCol = '#1e293b', shortDark = '#0f172a', shortHi = '#334155';
  const skin = '#e0ac82', skinDark = '#9c6b43', skinHi = '#f3c69f';
  const sockCol = '#f8fafc', sockDark = '#cbd5e1';
  const shoeCol = '#ffffff', shoeAccent = '#2563eb';
  const zz = (a, b) => (proj(a)[2] + proj(b)[2]) / 2;

  const L = (a, b, r1, r2, c, d, hi) => it.push({
    z: zz(a, b),
    f() { drawCapsule3D(a, b, r1, r2, c, d, hi); }
  });
  const C = (P, r, c, ring, dz) => it.push({
    z: proj(P)[2] + (dz || 0),
    f() { drawJointSphere(P, r, c, ring); }
  });

  // Perna Esquerda (Coxa -> Joelho -> Canela/Meia -> Tênis)
  const midLShin = V.add(V.mul(J.LKN, 0.45), V.mul(J.LA, 0.55));
  L(J.HL, J.LKN, 0.082, 0.056, shortCol, shortDark, shortHi);
  C(J.LKN, 0.052, skin, skinDark);
  L(J.LKN, midLShin, 0.052, 0.042, skin, skinDark, skinHi);
  L(midLShin, J.LA, 0.043, 0.036, sockCol, sockDark);
  L(J.LHL, J.LTO, 0.044, 0.034, shoeCol, '#64748b', shoeAccent);

  // Perna Direita (Coxa -> Joelho -> Canela/Meia -> Tênis)
  const midRShin = V.add(V.mul(J.RKN, 0.45), V.mul(J.RA, 0.55));
  L(J.HR, J.RKN, 0.084, 0.058, shortCol, shortDark, shortHi);
  C(J.RKN, 0.054, skin, skinDark);
  L(J.RKN, midRShin, 0.054, 0.043, skin, skinDark, skinHi);
  L(midRShin, J.RA, 0.044, 0.037, sockCol, sockDark);
  L(J.RHL, J.RTO, 0.044, 0.034, shoeCol, '#64748b', shoeAccent);

  // Braço Esquerdo (Ombro/Manga -> Cotovelo -> Antebraço)
  const midLArm = V.add(V.mul(J.SL, 0.55), V.mul(J.LE, 0.45));
  L(J.SL, midLArm, 0.056, 0.048, '#1d4ed8', '#1e3a8a', '#3b82f6');
  L(midLArm, J.LE, 0.046, 0.040, skin, skinDark, skinHi);
  C(J.LE, 0.038, skin, skinDark);
  L(J.LE, J.LW, 0.039, 0.028, skin, skinDark, skinHi);

  // Braço Direito (Ombro/Manga -> Cotovelo -> Antebraço)
  const midRArm = V.add(V.mul(J.SR, 0.55), V.mul(J.RE, 0.45));
  L(J.SR, midRArm, 0.058, 0.050, '#1d4ed8', '#1e3a8a', '#3b82f6');
  L(midRArm, J.RE, 0.048, 0.042, skin, skinDark, skinHi);
  C(J.RE, 0.040, skin, skinDark);
  L(J.RE, J.RW, 0.041, 0.029, skin, skinDark, skinHi);

  // Pescoço e Tronco
  L(J.neck, J.head, 0.042, 0.038, skin, skinDark);
  it.push({ z: zz(J.pel, J.neck), f() { drawTorsoRefined(J); } });
  C(J.SL, 0.056, '#1d4ed8', '#1e3a8a');
  C(J.SR, 0.058, '#1d4ed8', '#1e3a8a');

  // Raquete + Mãos Articuladas com 5 Dedos Individuais
  const gripAxis = V.norm(V.sub(J.RKH, J.RW));
  const gripRad = rad(GRIPS[st.grip].ang);
  const palmNormal = V.norm(rotAroundAxis(J.RN || [0, 0, 1], gripAxis, gripRad));
  const forearmDirL = V.norm(V.sub(J.LW, J.LE));
  const isTwoHanded = (st.id === 'bh');

  it.push({
    z: proj(J.RKH)[2] - 0.08,
    f() {
      racketDrawRefined(J);
      // Mão direita com 5 dedos individuais abraçando o cabo
      drawHandWithFingers(J.RW, V.norm(V.sub(J.RW, J.RE)), gripAxis, palmNormal, true, false);
    }
  });

  it.push({
    z: proj(J.LW)[2] - 0.04,
    f() {
      // Mão esquerda com 5 dedos individuais articulados
      drawHandWithFingers(J.LW, forearmDirL, gripAxis, palmNormal, false, isTwoHanded);
    }
  });

  // Cabeça
  it.push({ z: proj(J.head)[2] - 0.05, f() { drawHeadRefined(J); } });

  // Ordenação Z-Buffer e renderização
  it.sort((a, b) => b.z - a.z).forEach(i => i.f());

  // Marcadores biomecânicos e destaques do treinador
  if (!st.clean) {
    ['SR', 'SL', 'RE', 'LE', 'RW', 'LW', 'HR', 'HL', 'RKN', 'LKN', 'RA', 'LA'].forEach(k => dot(J[k], 0.014, '#ffffffcc'));
    hl.forEach(k => {
      if (!J[k]) return;
      const p = proj(J[k]), r = (0.09 + 0.05 * Math.sin(st.pulse * 5)) * SCL;
      cx.strokeStyle = '#ffb300';
      cx.lineWidth = 3;
      cx.beginPath();
      cx.arc(p[0], p[1], r, 0, Math.PI * 2);
      cx.stroke();
      cx.fillStyle = '#ffb30033';
      cx.fill();
    });
  }
}

let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;

function playRacketHit(speedMs=22,spinRpm=2000){
  if(!st.sound)return;
  const ctx=ensureAudio();
  if(!ctx)return;
  const now=ctx.currentTime;
  const intensity=Math.min(1.3,Math.max(0.45,(speedMs||20)/22));
  const isSlice=(spinRpm||0)<-500;

  // 1. Ressonância das cordas (ping elástico curto ~165-210 Hz)
  const osc=ctx.createOscillator();
  const oscGain=ctx.createGain();
  osc.type='triangle';
  const baseFreq=isSlice?155:195;
  osc.frequency.setValueAtTime(baseFreq*1.25,now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq*0.62,now+0.085);
  oscGain.gain.setValueAtTime(0.32*intensity,now);
  oscGain.gain.exponentialRampToValueAtTime(0.001,now+0.09);
  osc.connect(oscGain);
  oscGain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now+0.095);

  // 2. Impacto seco do feltro nas cordas (ruído filtrado em banda)
  const bufSize=Math.floor(ctx.sampleRate*0.075);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){
    data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.016));
  }
  const noise=ctx.createBufferSource();
  noise.buffer=buf;
  const filter=ctx.createBiquadFilter();
  filter.type='bandpass';
  filter.frequency.setValueAtTime(isSlice?950:1250,now);
  filter.Q.setValueAtTime(1.8,now);
  const nGain=ctx.createGain();
  nGain.gain.setValueAtTime(0.55*intensity,now);
  nGain.gain.exponentialRampToValueAtTime(0.001,now+0.072);
  noise.connect(filter);
  filter.connect(nGain);
  nGain.connect(ctx.destination);
  noise.start(now);
}

  if(!st.sound)return;
  const ctx=ensureAudio();
  if(!ctx)return;
  const now=ctx.currentTime;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(135,now);

  gain.connect(ctx.destination);

}

const SCI={g:['Cadeia no forehand (Landlinger e cols., 2010; 6 profissionais ATP, Vicon 400 Hz): pico de rotação da pelve ~75 ms antes do contato, tronco ~57 ms antes, rotação interna do ombro ~24 ms depois e extensão do cotovelo ~35 ms depois.','O timing separou elite de jovens de alto nível: picos de pelve e tronco mais tardios (-75 vs -93 ms e -57 vs -75 ms). Velocidade horizontal da raquete no impacto: ~33 m/s vs ~31 m/s.','Principais motores do forehand (Reid, Elliott e Crespo, 2013): rotação axial de pelve e tronco, adução horizontal e rotação interna do ombro.','Stance aberto x fechado: velocidade da raquete e do tronco praticamente iguais (Knudson; Kawamoto e cols., 2019). A aberta gira mais o tronco, a fechada usa mais transferência de peso.','Topspin: depende do ângulo da face e da trajetória da raquete perto do impacto; contato mais longo com a bola ajuda (J Sports Sci Med, 2017).'],s:['Contribuições à velocidade horizontal da raquete (66 sacadores; Tanabe e Ito, 2007): rotação interna do ombro 41%, flexão palmar do punho 32%. A rotação interna foi o que distinguiu sacadores rápidos de lentos.','Gordon e Dapena (2006): extensão do cotovelo e flexão do punho têm contribuições grandes; a pronção do antebraço dá contribuição breve e negativa.','Elliott e cols.: a velocidade linear das articulações cresce em sequência joelho, quadril, ombro, cotovelo e punho.','Pré-estiramento elástico (rotação externa seguida da interna) melhora o desempenho em ~20%. Uma pausa de 1,5 s reduz a velocidade de rotação interna em ~20%: não pare entre armar e acelerar (Elliott).','Profissionais com IMU (Frontiers, 2025; 8 jogadores): pelve, tronco e braço giram mais rápido no 1º saque que no 2º, e nem sempre seguem sequência proximal-distal estrita.'],a:['Aproximação (dados charting): ~96% caem dentro; se a bola volta, quem está na rede vence ~58,6%. A paralela é mais arriscada, mas cobre a passada reta.','Split step: pouso no momento em que o rival bate, para sair com a perna de fora e o primeiro passo na direção da bola.'],v:['Sem estudo biomecânico específico incluído nesta versão. Vale o princípio geral: sequência pernas, tronco, ombro, cotovelo e punho.'],k:['Velocidade x spin (Sports Health; dados de Elliott e Sakurai): saque plano ~190 km/h e ~1.200 rpm, slice ~170 km/h e ~2.200 rpm, kick ~150 km/h e ~3.200 rpm. Existe relação inversa entre velocidade e spin.','Toss do kick (guias de treinadores): ligeiramente atrás da cabeça e para o lado não dominante; a raquete sobe pela parte de trás da bola, de ~7h a ~1h.','Estudo com 7 atletas universitários: o kick gerou maiores forças nas costas e no ombro que o plano e o slice; o slice teve as menores forças.'],r:['Split step: pouse exatamente no contato do sacador, com pausa breve só para identificar a direção (Bollettieri; guias de treinadores).','Backswing de cerca de 2/3 do normal; quanto maior o saque, menor o backswing. A devolução ofensiva é um groundstroke compacto e o chip/block lembra um voleio.','Contato à frente do centro de gravidade e com o corpo indo para frente.'],l:['Lob de ataque (guias de treinadores): parece um groundstroke, com subida mais íngreme de baixo para cima; o disfarce é essencial.','Chip lob na devolução: swing de voleio com a face mais aberta, em torno de 45° (Tennis.com).'],d:['Drop shot: passar por baixo da bola com a face para criar underspin e fazer a bola morrer curta; sem disfarce perde o efeito surpresa (Tennis.com).','Misturar lob, drop e devoluções fortes em segundos saques fracos põe o sacador na defensiva (TennisOne).']},SK={fh:'g',bh:'g',b1:'g',sl:'g',sv:'s',sm:'s',ap:'a',vl:'v',kk:'k',rt:'r',lb:'l',dp:'d'};

const mnb=$('#main-menu'),mnBtn=$('#mnb');

}

  <div class="dr-card"><h4>1. Shadow Swing (Sem Bola)</h4><p>Faça 3 séries de 10 repetições focando na rotação da pelve e no timing do golpe em frente ao espelho.</p></div>
  <div class="dr-card"><h4>2. Ajuste de Pés (Footwork)</h4><p>Treine o Split Step seguido de 2 passos de ajuste rápidos em direção ao ponto de impacto simulado.</p></div>
  <div class="dr-card"><h4>3. Controle de Alvo</h4><p>Em quadra real, posicione cones nas zonas profundas e busque 8 acertos consecutivos cruzados.</p></div>
  <small style="color:var(--mut);cursor:pointer;" onclick="document.getElementById('drill-panel').style.display='none';renderMainMenu()">✕ Fechar painel de treinos</small>`;
  dp.style.display='block';

function renderMainMenu(){
  mnb.innerHTML='';
  const sciOpen=$('#sci').style.display==='block';
  const drillOpen=$('#drill-panel').style.display==='block';
  const items=[
    {label:'🔊 Som Impacto',on:st.sound,badge:st.sound?'ON':'OFF',act:()=>{
      st.sound=!st.sound;
      if(st.sound)ensureAudio();
    }},
    {label:'Texto',on:st.showText,badge:st.showText?'ON':'OFF',act:()=>{
      st.showText=!st.showText;
      document.body.classList.toggle('hide-cap',!st.showText);
      rs();
    }},
    {label:st.coach?'🔊 Treinador On':'🔊 Treinador Off',on:!!st.coach,badge:st.coach?'ON':'OFF',act:()=>{
      st.coach=!st.coach;st.hold=0;st.done.clear();

      if(st.coach)st.t=0;
    }},
    {label:'Rotação',on:!!VEC.Rotação,badge:VEC.Rotação?'ON':'OFF',act:()=>{VEC.Rotação=!VEC.Rotação}},
    {label:'Peso',on:!!VEC.Peso,badge:VEC.Peso?'ON':'OFF',act:()=>{VEC.Peso=!VEC.Peso}},
    {label:'Cadeia',on:!!VEC.Cadeia,badge:VEC.Cadeia?'ON':'OFF',act:()=>{VEC.Cadeia=!VEC.Cadeia}},
    {label:'🎯 Tática',on:st.tactics,badge:st.tactics?'ON':'OFF',act:()=>{st.tactics=!st.tactics}},
    {label:'🔬 Estudos',on:sciOpen,badge:sciOpen?'ON':'OFF',act:()=>{toggleSci()}},
    {label:'📋 Drill',on:drillOpen,badge:drillOpen?'ON':'OFF',act:()=>{toggleDrill()}},
    {label:'🎾 Pegada',on:true,badge:st.grip,act:()=>{
      const keys=Object.keys(GRIPS);
      st.grip=keys[(keys.indexOf(st.grip)+1)%keys.length];
    }}
  ];
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className=it.on?'on':'';
    b.innerHTML='<span>'+it.label+'</span><span style="font-size:11px;opacity:.9">'+it.badge+'</span>';
    b.onclick=ev=>{
      ev.stopPropagation();
      it.act();
      renderMainMenu();
    };
    mnb.appendChild(b);
  });
}

const ppb=$('#ppb'),spdMenu=$('#spd-menu'),spList=[.25,.5,.75,1,1.25];
function renderSpdMenu(){
  spdMenu.innerHTML='';
  spList.forEach(v=>{

    spdMenu.appendChild(b);
  });
}

let lpTimer=null,lpTriggered=false;

// Gestos no Canvas: 1 dedo rotaciona a câmera, 2 dedos (pinça) controlam zoom in/out
const activePtrs=new Map();
let pinchDist0=0,pinchZoom0=1,lastSingleX=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePtrs.size===1){
    st.drag=1;
    lastSingleX=e.clientX;
  }else if(activePtrs.size===2){
    st.drag=0;
    const pts=[...activePtrs.values()];
    pinchDist0=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y)||1;
    pinchZoom0=st.zoom;
  }
});
cv.addEventListener('pointermove',e=>{
  if(!activePtrs.has(e.pointerId))return;
  activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePtrs.size===1&&st.drag){
    st.yaw+=(e.clientX-lastSingleX)*.6;
    st.tyaw=st.yaw;
    lastSingleX=e.clientX;
  }else if(activePtrs.size===2){
    const pts=[...activePtrs.values()];
    const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    if(pinchDist0>0){
      st.zoom=Math.min(2.5,Math.max(.6,pinchZoom0*(dist/pinchDist0)));
    }
  }
});
function endPtr(e){
  activePtrs.delete(e.pointerId);
  if(activePtrs.size===1){
    const rem=[...activePtrs.values()][0];
    st.drag=1;
    lastSingleX=rem.x;
  }else{
    st.drag=0;
    pinchDist0=0;
  }
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{st.zoom=Math.min(2.5,Math.max(.6,st.zoom-e.deltaY*.001))},{passive:true});
