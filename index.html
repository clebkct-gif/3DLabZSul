const HB_GLOSS_RAW=`Love (zero)|PR|Zero ponto no placar. A origem é incerta; a explicação popular é o francês l'œuf (ovo, pelo formato do zero).
15 / 30 / 40|PR|Sequência de pontos dentro de um game: 0 (love), 15, 30, 40 e game. O salto de 30 para 40 é só convenção histórica.
Game|PR|Unidade básica de pontuação. Vence quem faz 4 pontos com diferença mínima de 2 (ou seja, passa de 40 com vantagem).
Set|PR|Conjunto de games. Vence quem chega a 6 games com 2 de diferença; com 6–6 normalmente se joga tiebreak.
Partida (Match)|PR|Disputa completa, em melhor de 3 sets (2 vencidos) ou melhor de 5 sets (3 vencidos), conforme o torneio.
Melhor de 3 / Melhor de 5|PR|Formatos de partida: vence quem ganhar 2 de 3 sets ou 3 de 5 sets. Grand Slams masculinos usam melhor de 5.
Deuce (40 iguais)|PR|Placar de 40–40. Para ganhar o game é preciso abrir dois pontos de vantagem: primeiro a vantagem, depois o game.
Vantagem (Advantage / Ad)|PR|Ponto seguinte ao deuce. Se quem tem a vantagem ganhar o ponto seguinte, vence o game; se perder, volta ao deuce.
Game point|PR|Ponto que, se vencido, dá o game ao jogador que o disputa.
Set point|PR|Ponto que, se vencido, dá o set ao jogador que o disputa.
Match point|PR|Ponto que, se vencido, encerra a partida a favor de quem o disputa.
Break point|PR|Ponto em que o devolvedor pode quebrar o serviço do adversário. Aparece com 30–40, 15–40, 0–40 ou vantagem do devolvedor.
Quebra (Break)|PR|Vencer um game em que o adversário estava sacando. Quebrar é a principal forma de abrir vantagem no set.
Manter o saque (Hold)|PR|Vencer o próprio game de serviço. Sequências de holds levam o set ao tiebreak.
Quebra de volta (Break back)|PR|Quebrar imediatamente após ter sido quebrado, recuperando o equilíbrio do set.
Dupla quebra (Double break)|PR|Estar duas quebras à frente no set, o que torna a virada muito difícil.
Tiebreak (desempate)|PR|Game especial a 7 pontos com diferença de 2. O primeiro sacador saca 1 ponto; depois cada jogador saca 2 seguidos. Troca de lado a cada 6 pontos.
Super tiebreak (Match tiebreak)|PR|Tiebreak a 10 pontos (diferença de 2) usado no lugar do terceiro set ou do set decisivo em muitos formatos.
Ponto decisivo (No-ad / Golden point)|PR|Em 40–40, joga-se um único ponto decisivo, sem vantagem. É comum em duplas e torneios de formato rápido.
Pneu / Bagel (6–0)|PR|Set vencido por 6–0. Em português brasileiro é muito usado "pneu". Dois sets assim são o "double bagel".
Breadstick (6–1)|PR|Set vencido por 6–1, gíria em inglês parecida com bagel.
Falta (Fault)|PR|Saque inválido: errou o quadrado de serviço, tocou a rede e caiu fora, ou ocorreu infração de pé. Duas faltas seguidas geram dupla falta.
Dupla falta (Double fault)|PR|Duas faltas consecutivas no mesmo ponto. O ponto vai para o devolvedor.
Falta de pé (Foot fault)|PR|Infração do sacador que pisa na linha de fundo ou na sua extensão antes de bater, ou que "corre" invadindo a quadra antes do contato.
Let|PR|Ponto a ser repetido. No saque, ocorre quando a bola toca a fita da rede e cai no quadrado correto (o saque é repetido, sem contar como falta).
Fita (Net cord)|PR|Faixa superior da rede. Bola que toca a fita no rali continua em jogo se passar para o outro lado.
Ace|PR|Saque que o devolvedor não consegue tocar com a raquete, ganhando o ponto direto.
Winner|PR|Golpe vencedor: a bola cai na quadra e o adversário não consegue tocá-la.
Erro forçado (Forced error)|PR|Erro causado por um golpe difícil do adversário (peso, ângulo, velocidade ou posição).
Erro não forçado (Unforced error)|PR|Erro cometido sem pressão relevante do adversário, em bola que normalmente seria controlável.
Rali (Rally)|PR|Troca de bolas entre os jogadores durante um ponto, do saque até o fim do ponto.
Bola boa (In) / Fora (Out)|PR|Uma bola é boa se tocar qualquer parte da linha; basta encostar nela. Fora é quando cai inteiramente além da linha.
Toque duplo (Double hit)|PR|Bater na bola duas vezes no mesmo golpe, o que é irregular. Se for um único movimento contínuo, é permitido.
Toque na rede / Invasão (Net touch)|PR|Tocar a rede, os postes ou o lado do adversário com o corpo ou a raquete durante o ponto faz perder o ponto.
Interferência (Hindrance)|PR|Ato (intencional ou não) que atrapalha o adversário, como gritar durante o golpe adversário. O árbitro pode repetir o ponto ou dar o ponto.
Troca de lado (Changeover)|PR|Troca de lados da quadra a cada game ímpar. Dura cerca de 90 segundos nas competições profissionais (120 s entre sets).
Tempo entre pontos (Shot clock)|PR|Limite de 20 a 25 segundos entre o fim de um ponto e o início do seguinte, conforme a competição, marcado por relógio.
Walkover (W.O.)|PR|Vitória sem jogar porque o adversário não compareceu ou desistiu antes do início.
Abandono (Retirement / RET)|PR|Quando um jogador desiste durante a partida, normalmente por lesão. O oponente avança.
Desclassificação (Default)|PR|Exclusão de um jogador da partida ou do torneio por violação grave do código de conduta.
Código de conduta (Code violation)|PR|Infrações como quebrar raquete, atrasar o jogo ou linguagem imprópria. Gera aviso, perda de ponto ou de game, até desclassificação.
Aviso (Warning)|PR|Primeira sanção do código de conduta. A reincidência custa um ponto.
Penalidade de ponto (Point penalty)|PR|Segunda infração: o jogador perde um ponto imediatamente.
Penalidade de game (Game penalty)|PR|Terceira infração: o jogador perde um game inteiro.
Sacador / Devolvedor (Server / Receiver)|PR|Sacador é quem inicia o ponto; devolvedor é quem responde o saque. Os papéis alternam a cada game.
Ordem de saque|PR|Define quem saca em cada game. Em duplas, cada parceiro saca em games alternados, mantendo a mesma ordem durante o set.
Primeiro saque / Segundo saque|PR|O sacador tem direito a duas tentativas por ponto. O primeiro costuma ser mais agressivo; o segundo, mais seguro.
Contagem de saque (Serve count)|PR|Total de games de serviço ganhos e perdidos, usado para estatísticas como hold% e break%.
Rodízio de bolas|PR|Troca de bolas novas em torneios, geralmente após 7 e depois a cada 9 games, para manter peso e velocidade uniformes.
Quadra de simples / duplas|QS|Em simples usa-se a largura de 8,23 m; em duplas, 10,97 m (com os corredores laterais).
Linha de fundo (Baseline)|QS|Linha do fundo da quadra, a 11,89 m da rede. A bola é boa se tocar a linha.
Linha de serviço (Service line)|QS|Linha a 6,40 m da rede que delimita o fundo dos quadrados de saque.
Quadrado de saque (Service box)|QS|Retângulo de 6,40 m por 4,115 m onde o saque precisa cair, na diagonal do sacador.
Marca central de serviço|QS|Pequena marca no meio da linha de fundo que define o lado em que o sacador deve ficar.
Linha central de serviço|QS|Linha que divide ao meio a área entre a rede e a linha de serviço, separando os dois quadrados.
Linha lateral (Sideline)|QS|Limites laterais da quadra. Existem a linha de simples e a linha de duplas (corredor).
Corredor (Alley)|QS|Faixa de 1,37 m entre a linha de simples e a de duplas. Só vale em duplas.
Lado da vantagem (Ad court)|QS|Lado esquerdo da quadra do ponto de vista do sacador. O sacador usa este lado em pontos ímpares (15–0, 30–15, vantagem etc.) e saca para o quadrado diagonal.
Lado do deuce (Deuce court)|QS|Lado direito da quadra do ponto de vista do sacador. O sacador usa este lado em pontos pares (0–0, 30–0, 15–15, deuce etc.).
Rede (Net)|QS|Altura de 1,07 m nos postes e 0,914 m no centro, onde a faixa central a segura.
Poste (Net post)|QS|Suporte da rede, fixado a 0,914 m fora da linha lateral de simples (ou duplas).
Faixa central (Center strap)|QS|Fita que mantém a rede a 0,914 m no meio da quadra.
Zona de transição (No man's land)|QS|Região entre a linha de fundo e a linha de serviço, onde o jogador fica vulnerável, sem espaço para atacar nem para defender.
T (T do saque)|QS|Encontro da linha central de serviço com a linha de serviço. Saque no T é o saque mais perto do centro.
Saibro (Clay)|QS|Superfície de terra batida, com bote alto e mais lento. Favorece rali longo, topspin e deslizes.
Quadra rápida (Hard court)|QS|Superfície de concreto/acrílico, com bote regular e velocidade média a rápida.
Grama (Grass)|QS|Superfície natural com bote baixo e rápido, que favorece saque forte, slice e jogo de rede.
Carpete (Carpet)|QS|Superfície sintética indoor de bote baixo e rápido, hoje rara no circuito.
Quadra coberta (Indoor)|QS|Quadra em ambiente fechado, sem vento e sem sol. Costuma ser mais rápida e de bote consistente.
Saibro verde (Green clay)|QS|Saibro americano mais escuro e firme, com velocidade intermediária entre saibro vermelho e quadra rápida.
Velocidade da quadra (Court Pace Index)|QS|Medida (CPI) do quanto a superfície acelera ou desacelera a bola; quadras rápidas têm CPI mais alto.
Bote (Bounce)|QS|Quicada da bola no chão. Varia em altura e velocidade conforme superfície, pressão e efeito da bola.
Bote baixo (Skid)|QS|Bola que quica baixo e escorrega, comum em grama e slice. Exige flexão de joelhos para devolver.
Bote alto (High bounce)|QS|Bola que sobe após o quique, típica do topspin no saibro. Muitas vezes chega à altura do ombro ou acima.
Vento (Wind)|QS|Fator tático em quadra aberta: joga a favor ou contra, e exige ajuste de altura e de ponto de impacto.
Sol (Sun)|QS|Fator tático no saque e no smash. Trocar de lado do lançamento ou usar boné/óculos ajuda.
Teto retrátil (Roof)|QS|Cobertura que fecha em dias de chuva ou calor em grandes arenas, transformando a quadra em indoor.
Pausa por chuva (Rain delay)|QS|Interrupção de partida por chuva. O placar é mantido e a partida retoma quando a quadra está seca.
Marca da bola (Ball mark)|QS|Marca deixada no saibro. Usada para conferir se a bola foi boa ou fora, mostrando onde pousou.
Dimensões da quadra|QS|Comprimento de 23,77 m. Largura de 8,23 m (simples) e 10,97 m (duplas). Cada lado tem 11,89 m até a rede.
Árbitro de cadeira (Chair umpire)|AR|Árbitro principal, sentado na cadeira alta, responsável por placar, regras e decisões finais em disputa.
Juiz de linha (Line judge)|AR|Responsável por chamar bolas fora ou dentro. Em muitos torneios foi substituído por sistema eletrônico.
Juiz de rede (Net judge)|AR|Verifica toques na fita no saque (let). Pode ser dispensado por sensores eletrônicos.
Supervisor (Tournament referee)|AR|Autoridade máxima do torneio, chamado em disputas que o árbitro de cadeira não resolve.
Hawk-Eye (olho de falcão)|AR|Sistema de câmeras que reconstrói a trajetória da bola e indica se foi dentro ou fora, com margem de erro de poucos milímetros.
Chamada eletrônica de linha (ELC)|AR|Electronic Line Calling: sistema automático que anuncia "out" ou "fault" no lugar dos juízes de linha em muitos torneios.
Desafio (Challenge)|AR|Pedido do jogador para revisar uma chamada. Cada jogador tem um número limitado de desafios errados por set (comumente 3).
Correção (Overrule)|AR|Quando o árbitro de cadeira corrige uma chamada do juiz de linha por erro claro.
Gandula (Ball kid)|AR|Pessoa que recolhe as bolas e as entrega aos jogadores durante a partida.
Pausa médica (Medical timeout / MTO)|AR|Atendimento médico no meio da partida, limitado em tempo e em número, concedido por lesão tratável.
Regra do calor (Heat rule)|AR|Intervalo extra permitido em condições de calor extremo, definido por índice de temperatura e umidade.
Orientação do técnico (Coaching)|AR|Instruções do técnico durante o jogo. Permitidas ou restritas conforme o circuito e a fase da partida.
Conduta antiesportiva (Unsportsmanlike conduct)|AR|Comportamento inadequado, como xingar, jogar a raquete ou assediar o árbitro. Sujeito a penalidades do código.
Fair play|AR|Postura de respeito às regras e aos oponentes, incluindo chamar a bola corretamente nas partidas sem árbitro.
Chamada de bola (Calling lines)|AR|Em jogos amadores sem juiz, cada jogador chama as bolas do seu lado. Em dúvida, a bola é boa para o adversário.
Grand Slam|TO|Os quatro maiores torneios do ano: Australian Open, Roland Garros, Wimbledon e US Open. Pontuam mais e pagam os maiores prêmios.
Australian Open|TO|Primeiro Grand Slam do ano (janeiro), em quadra rápida, em Melbourne.
Roland Garros (French Open)|TO|Grand Slam em saibro, em Paris, entre maio e junho.
Wimbledon|TO|Grand Slam em grama, em Londres, entre junho e julho. É o mais antigo e exige vestimenta branca.
US Open|TO|Grand Slam em quadra rápida, em Nova York, entre agosto e setembro. Último do ano.
ATP Tour|TO|Circuito profissional masculino organizado pela Association of Tennis Professionals.
WTA Tour|TO|Circuito profissional feminino organizado pela Women's Tennis Association.
Masters 1000 (ATP)|TO|Os nove torneios de maior pontuação do circuito masculino depois dos Grand Slams, como Indian Wells, Miami e Roma.
WTA 1000|TO|Categoria de elite do circuito feminino abaixo dos Grand Slams, equivalente ao Masters 1000.
ATP 500 / ATP 250|TO|Categorias intermediárias do circuito masculino, com 500 e 250 pontos para o campeão.
WTA 500 / WTA 250|TO|Categorias intermediárias do circuito feminino.
ATP Finals / WTA Finals|TO|Torneios de fim de temporada com os oito melhores do ano, em formato de grupos seguido de semifinais.
Challenger|TO|Circuito de desenvolvimento masculino logo abaixo do ATP Tour. Importante para subir no ranking.
ITF World Tennis Tour|TO|Circuito inicial de profissionais (M15, M25, W15, W35 etc.), onde se acumulam os primeiros pontos de ranking.
Futures|TO|Nome antigo do circuito de entrada da ITF, hoje chamado World Tennis Tour.
Copa Davis (Davis Cup)|TO|Principal competição mundial por equipes masculinas entre países.
Billie Jean King Cup|TO|Competição mundial por equipes femininas entre países (antes Fed Cup).
Laver Cup|TO|Torneio por equipes Europa contra Resto do Mundo.
United Cup|TO|Torneio por equipes mistas, com jogos masculinos, femininos e de duplas mistas.
Jogos Olímpicos|TO|Torneio individual e de duplas disputado a cada quatro anos. Não distribui pontos de ranking ATP/WTA, mas dá grande prestígio.
Ranking (ATP / WTA)|TO|Lista baseada nos pontos dos melhores resultados das últimas 52 semanas. Define chaves e cabeças de chave.
Race|TO|Ranking que soma só os pontos do ano civil corrente. É usado para definir quem vai às Finais.
Cabeça de chave (Seed)|TO|Jogadores melhor ranqueados que são distribuídos na chave para não se enfrentarem nas primeiras rodadas.
Convite (Wild card)|TO|Vaga na chave principal dada pela organização do torneio a um jogador sem ranking suficiente.
Qualificatório (Qualifying)|TO|Mini-torneio prévio em que jogadores de ranking mais baixo disputam as últimas vagas da chave principal.
Lucky loser|TO|Jogador derrotado no qualifying que entra na chave principal por desistência de outro.
Exceção especial (Special exempt)|TO|Vaga na chave dada a jogador que jogou outro torneio até tarde e não pôde se inscrever no qualificatório.
Ranking protegido (Protected ranking)|TO|Ranking antigo usado para inscrição após lesão longa, permitindo entrar em torneios sem perder status.
Chave (Draw)|TO|Tabela de eliminatória com os confrontos. Sorteada com cabeças de chave protegidas.
Chave principal (Main draw)|TO|A chave de eliminatória principal do torneio, depois do qualificatório.
Bye|TO|Passagem direta para a rodada seguinte sem jogar, comum para os cabeças de chave quando a chave tem vagas ímpares.
Round robin (Fase de grupos)|TO|Formato em que todos jogam contra todos num grupo. Usado em torneios de equipe e nas Finais.
Eliminatória (Knockout)|TO|Formato em que perder significa sair do torneio.
UTR (Universal Tennis Rating)|TO|Escala de 1 a 16,5 que mede o nível de qualquer jogador, amador ou profissional, baseada em resultados.
NTRP|TO|Escala de nível 1,0 a 7,0 usada nos EUA para amadores. Valores como 3,5 e 4,5 são faixas comuns de clubes.
CBT|TO|Confederação Brasileira de Tênis, responsável pelo ranking e pelos circuitos nacionais no Brasil.
Categorias (Open, Veteranos, Sub-14)|TO|Divisões de torneios por idade e nível. Sub-14 e Sub-16 formam a base de jovens; Veteranos são divididos por faixa etária.
Tênis em cadeira de rodas (Wheelchair tennis)|TO|Modalidade adaptada com as mesmas regras, mas com dois quiques permitidos, sendo o primeiro dentro da quadra.
Beach tennis|TO|Modalidade jogada na areia, com raquete sem cordas e bola de menor pressão. Bastante popular no Brasil.
Padel|TO|Modalidade jogada em quadra menor cercada por vidro, em duplas, com raquete sólida e paredes em jogo.
Pickleball|TO|Esporte de raquete jogado em quadra pequena com bola perfurada e raquete sólida, popular entre amadores.
Raquete (Racket)|EQ|Equipamento de jogo composto por cabeça (com cordas), garganta e cabo. Normalmente de grafite, pesa entre 255 e 330 g.
Cabeça (Head)|EQ|Parte oval da raquete onde fica o encordoamento. O tamanho em cm² ou pol² influencia potência e tolerância.
Aro (Frame / Hoop)|EQ|Estrutura que contorna a cabeça e segura as cordas. Perfis largos dão mais potência; finos, mais controle.
Garganta (Throat)|EQ|Região em Y entre a cabeça e o cabo. Em algumas raquetes é aberta; em outras, fechada.
Cabo (Handle)|EQ|Parte que a mão segura, normalmente octogonal. Recoberto pelo grip.
Base do cabo (Butt cap)|EQ|Extremidade inferior do cabo, onde costuma haver a marca do fabricante e o tamanho de grip.
Protetor de aro (Bumper guard)|EQ|Faixa de plástico no topo do aro que protege contra batidas no chão.
Ilhós (Grommets)|EQ|Pequenas peças plásticas nos furos do aro que protegem as cordas do atrito com a borda.
Padrão de cordas (String pattern)|EQ|Número de cordas verticais x horizontais, como 16x19 (aberto, mais efeito) ou 18x20 (fechado, mais controle).
Padrão aberto (Open pattern)|EQ|Padrão com menos cordas e maior espaçamento (como 16x19). Facilita efeito e dá mais potência, mas as cordas se movem mais.
Padrão fechado (Dense pattern)|EQ|Padrão com mais cordas e menor espaçamento (como 18x20). Controle maior e maior durabilidade das cordas.
Ponto doce (Sweet spot)|EQ|Região do prato de cordas onde a bola sai com mais potência e menos vibração. Quanto maior a cabeça, maior costuma ser.
Tamanho da cabeça (Head size)|EQ|Área do prato de cordas. Valores comuns vão de 93 a 110 pol² (cerca de 600 a 710 cm²).
Peso da raquete (Weight)|EQ|Massa da raquete, geralmente entre 255 e 330 g sem cordas. Raquetes mais pesadas são mais estáveis e menos manobráveis.
Balanço (Balance)|EQ|Onde está o ponto de equilíbrio do peso: head-light (HL, mais no cabo), head-heavy (HH, mais na cabeça) ou neutro (even).
Swingweight|EQ|Medida da dificuldade de balançar a raquete (inércia na rotação), em kg·cm². Valores típicos ficam em torno de 300 a 340.
Twistweight (Peso torcional)|EQ|Resistência da raquete a torcer no impacto fora do centro. Maior twistweight significa mais estabilidade.
Rigidez (Stiffness / RA)|EQ|Quanto o quadro flexiona no impacto. Raquetes mais rígidas (RA alto) dão mais potência e transmitem mais choque.
Largura do perfil (Beam)|EQ|Espessura do aro em mm. Perfil largo dá mais potência; fino, mais sensibilidade e controle.
Tamanho de empunhadura (Grip size)|EQ|Medida da circunferência do cabo, de 0 (L0) a 5 (L5), ou em polegadas (4 a 4 5/8). Deve caber na mão sem ficar folgado.
Grip (Replacement grip)|EQ|Fita de borracha ou poliuretano colocada em volta do cabo. Sobre ela se coloca o overgrip.
Overgrip|EQ|Fita fina e macia colocada sobre o grip para absorver suor e dar aderência. Deve ser trocado com frequência.
Antivibrador (Dampener)|EQ|Pequena peça colocada nas cordas para reduzir o som e a vibração percebidos. Não diminui a vibração do quadro.
Fita de chumbo (Lead tape)|EQ|Fita pesada colada no aro ou no cabo para alterar peso, balanço e estabilidade.
Customização|EQ|Ajustes feitos pelo jogador, como chumbo, grip e cordas, para adaptar a raquete ao próprio estilo.
Tênis de quadra (Tennis shoes)|EQ|Calçado específico com solado resistente, amortecimento e suporte lateral. O padrão do solado varia por superfície.
Solado (Outsole)|EQ|Parte inferior do tênis. Em saibro, desenho em espinha; em quadra rápida, borracha mais dura e lisa.
Palmilha (Insole)|EQ|Camada interna do tênis que amortece e dá suporte ao arco do pé.
Munhequeira (Wristband)|EQ|Faixa de tecido no pulso que absorve suor para manter o grip seco.
Viseira / Boné (Visor / Cap)|EQ|Proteção contra sol e suor. Obrigatório ou comum em diversas condições de jogo.
Bolsa de raquetes (Racket bag)|EQ|Mochila ou bolsa termicamente isolada para levar raquetes, bolas, toalha e acessórios.
Máquina de bolas (Ball machine)|EQ|Equipamento que lança bolas com velocidade, efeito e direção programados, para treino individual.
Cesto de bolas (Ball hopper)|EQ|Cesto metálico com suporte para guardar e recolher bolas rapidamente.
Cordas (Strings)|RC|Material que forma o prato da raquete. Influencia potência, controle, efeito, conforto e durabilidade.
Encordoamento (Stringbed / Stringing)|RC|Conjunto de cordas montado no aro, chamado também de prato de cordas. Também é o processo de montar as cordas.
Cordas principais (Mains)|RC|Cordas verticais da raquete, que correm da garganta ao topo da cabeça.
Cordas cruzadas (Crosses)|RC|Cordas horizontais que passam entre as principais, formando a malha.
Tensão (Tension)|RC|Força aplicada ao esticar as cordas, em libras (lb) ou kg. Tensões comuns ficam entre 40 e 65 lb (18 a 30 kg).
Tensão baixa|RC|Mais potência, mais conforto e maior efeito de trampolim, mas menos controle.
Tensão alta|RC|Mais controle e sensibilidade, com menos potência e menos conforto.
Perda de tensão (Tension loss)|RC|Queda gradual da tensão com o tempo e o uso, mesmo sem tocar a bola. Poliéster perde tensão mais rápido que tripa natural.
Calibre (Gauge)|RC|Espessura da corda. Calibres usuais variam de 1,10 a 1,35 mm; mais fina dá mais efeito e sensibilidade, mais grossa dura mais.
Tripa natural (Natural gut)|RC|Corda de intestino de animal, a mais macia e a que melhor mantém a tensão. Cara e sensível à umidade.
Multifilamento (Multifilament)|RC|Corda feita de milhares de fibras, macia e confortável, com ótimo toque. Dura menos que poliéster.
Nylon sintético (Synthetic gut)|RC|Corda básica de nylon, barata e equilibrada, usada por iniciantes e jogadores recreativos.
Poliéster (Polyester / Poly)|RC|Corda rígida de grande durabilidade e controle, usada por jogadores de topspin e de swing rápido. Mais exigente para cotovelo e ombro.
Kevlar|RC|Fibra extremamente rígida, geralmente usada em híbridos para resistir a quebras. Pode agredir o cotovelo em tensão alta.
Corda híbrida (Hybrid)|RC|Combinação de dois tipos de corda, uma nas principais e outra nas cruzadas, para equilibrar potência, efeito e conforto.
Corda texturizada (Shaped / Textured)|RC|Corda com formato hexagonal, pentagonal ou superfície rugosa para morder mais a bola e gerar efeito.
Mobilidade das cordas (String movement)|RC|Capacidade de as cordas deslizarem e voltarem à posição. Importante para gerar efeito, mas pode causar desgaste.
Snapback|RC|Retorno rápido das cordas à posição original após se deslocarem no impacto, o que acrescenta rotação à bola.
Efeito de trampolim (Trampoline effect)|RC|Retorno elástico das cordas que acrescenta velocidade à bola. Maior com tensão baixa.
Quebra de cordas (String breakage)|RC|Ruptura da corda por desgaste ou impacto. Raquetes de padrão aberto com cordas finas quebram mais.
Encordoador (Stringer)|RC|Profissional que monta as cordas na raquete. A qualidade do trabalho afeta a consistência.
Máquina de encordoar (Stringing machine)|RC|Equipamento que tensiona as cordas: de manivela, de peso constante ou eletrônica.
Pré-tensionamento (Pre-stretch)|RC|Esticar a corda antes de fixá-la para reduzir a perda de tensão inicial.
Nó (Knot) / Amarração (Tie-off)|RC|Ponto em que a corda é presa ao aro depois de esticada. O tipo de nó afeta a manutenção da tensão.
Reencordoar (Restring)|RC|Trocar as cordas gastas. Uma regra comum é reencordoar tantas vezes por ano quantas vezes se joga por semana.
Cordas "mortas" (Dead strings)|RC|Cordas que perderam elasticidade e tensão, deixando o toque sem vida e menos potente.
Bola de tênis|BO|Bola de borracha com feltro, de 56,0 a 59,4 g e 6,54 a 6,86 cm de diâmetro, conforme regras da ITF.
Pressão da bola (Pressurized ball)|BO|Bola com ar pressurizado, mais viva e rápida, mas que perde pressão após aberta.
Bola sem pressão (Pressureless ball)|BO|Bola de borracha maciça, mais durável e pesada, usada em máquinas e treinos. Dá toque mais duro.
Bola Tipo 1 (rápida)|BO|Bola do tipo Fast, mais dura, para saibro e outras superfícies lentas.
Bola Tipo 2 (média)|BO|Bola do tipo Medium, para superfícies médias como quadras rápidas.
Bola Tipo 3 (lenta)|BO|Bola do tipo Slow ou High Altitude, mais macia, para quadras rápidas e ambientes de altitude.
Bola vermelha (Stage 3)|BO|Bola de espuma ou baixa compressão para crianças de até 8 anos, em quadras e redes reduzidas.
Bola laranja (Stage 2)|BO|Bola de baixa compressão para crianças de 8 a 10 anos, em quadra de 18 m.
Bola verde (Stage 1)|BO|Bola de pressão reduzida para crianças de 9 a 10 anos, em quadra de tamanho quase total.
Feltro (Felt)|BO|Cobertura de lã e nylon da bola. Desgasta com o uso e aumenta a resistência ao ar.
Penugem (Fuzz)|BO|Fibras do feltro. Bola "careca" perde efeito e velocidade.
Bola careca (Bald ball)|BO|Bola com feltro gasto, que voa mais rápido e controla pior.
Quique padrão (Bounce test)|BO|Teste ITF: solta-se a bola de 254 cm de altura e ela deve quicar entre 135 e 147 cm.
Bola nova (Fresh ball)|BO|Bola recém-aberta, rápida e viva. Em torneios, as bolas são trocadas em intervalos fixos.
Bola morta (Dead ball)|BO|Bola gasta e sem vida, que quica pouco e perde velocidade.
Tubo de bolas|BO|Embalagem pressurizada que mantém as bolas novas por mais tempo. Normalmente com 3 ou 4 bolas.
Rotação da bola (Spin rate)|BO|Quantidade de giros por minuto (rpm). Forehands profissionais costumam ficar entre 2.500 e 3.500 rpm.
Pegada (Grip)|PG|Forma de segurar a raquete. Define o ângulo da face, o tipo de efeito possível e o ponto ideal de contato.
Pegada continental (Continental / Hammer)|PG|Mão como se segurasse um martelo (base do dedo indicador na face 2 do cabo octogonal). Muito usada no saque, voleio e slice.
Pegada eastern de forehand|PG|Mão atrás do cabo (base do indicador na face 3). Boa para bolas planas e topspin moderado.
Pegada semi-western|PG|Mão mais embaixo (base do indicador na face 4). A mais usada hoje no forehand moderno, com topspin forte.
Pegada western|PG|Mão bem abaixo no cabo (face 5). Gera topspin muito alto, mas dificulta bolas baixas e o slice.
Pegada eastern de backhand|PG|Base do indicador na face 1 do cabo. Usada no backhand de uma mão e no drive de duas mãos.
Pegada de duas mãos (Two-handed grip)|PG|Duas mãos no cabo, com a dominante abaixo (normalmente continental) e a não dominante acima (normalmente semi-western de forehand).
Pegada do saque|PG|Continental ou levemente rotada para eastern de backhand, permitindo pronação do antebraço no contato.
Pegada do voleio|PG|Normalmente continental, que dá face aberta natural e permite bater de forehand e backhand sem trocar de pegada.
Troca de pegada (Grip change)|PG|Reajuste da mão no cabo entre golpes, por exemplo ao sair de um forehand e ir para um voleio.
Face da raquete (Racket face)|PG|Superfície das cordas voltada para a bola. Seu ângulo no contato (aberta, neutra ou fechada) define a altura e o efeito.
Face fechada (Closed face)|PG|Face inclinada para baixo no contato, o que produz bolas com topspin e trajetória mais baixa.
Face aberta (Open face)|PG|Face inclinada para cima, comum no slice, no voleio e no lob.
Pegada neutra|PG|Pegada de sensação intermediária, que mantém a face quase vertical no ponto de contato.
Bevel (faces do cabo)|PG|Cada uma das oito faces planas do cabo octogonal, numeradas de 1 a 8, usadas como referência de pegada.
Forehand (direita)|GO|Golpe executado do lado dominante do corpo, com a palma da mão dominante voltada para a rede. É normalmente o golpe mais agressivo.
Backhand (esquerda)|GO|Golpe executado do lado não dominante, com o dorso da mão dominante voltado para a rede. Pode ser de uma ou duas mãos.
Backhand de duas mãos (Two-handed backhand)|GO|Backhand com as duas mãos no cabo. Dá estabilidade e potência com menos exigência de punho.
Backhand de uma mão (One-handed backhand)|GO|Backhand com a mão dominante no cabo e braço livre se estendendo para trás. Exige mais técnica, mas dá alcance e variedade.
Golpe de fundo (Groundstroke)|GO|Qualquer golpe dado após o quique da bola, normalmente de forehand ou backhand, geralmente da linha de fundo.
Topspin (Liftado / Efeito para frente)|GO|Rotação da bola para frente (de baixo para cima). Faz a bola cair mais rápido, quicar alto e permite bater com margem sobre a rede.
Backspin (efeito para trás)|GO|Rotação da bola para trás (de cima para baixo). Mantém a bola baixa, dá estabilidade e a sustenta no ar.
Flat (Golpe chapado)|GO|Golpe com pouco efeito, batido em linha reta. É rápido, mas com menor margem sobre a rede.
Efeito lateral (Sidespin)|GO|Rotação em torno do eixo vertical. Faz a bola curvar para um lado em vez de subir ou descer.
Slice (golpe cortado)|GO|Golpe de cima para baixo com face aberta. Produz bola baixa e quique curto, útil para defesa e para variar o ritmo.
Drop shot (Curtinha / Amortie)|GO|Bola curta, com muito slice, que quica perto da rede. Funciona melhor com o adversário atrás da linha de fundo.
Lob (Balão)|GO|Bola alta que passa por cima do adversário na rede. Pode ser defensivo (alto e profundo) ou ofensivo (baixo e rápido).
Passing shot (Passada)|GO|Golpe que passa ao lado do jogador na rede, em cruzada ou paralela, antes que ele consiga alcançar.
Bola de aproximação (Approach shot)|GO|Golpe dado para subir à rede, normalmente na quadra curta, com profundidade e slice ou drive.
Voleio (Volley)|GO|Golpe dado antes da bola quicar, com swing curto. É o golpe típico de rede.
Meia-vôlei (Half-volley)|GO|Golpe dado logo após o quique, a poucos centímetros do chão. Exige face firme e pouca preparação.
Voleio de swing (Swing volley)|GO|Voleio mais ofensivo, com swing completo, em bola alta e sem quicar, geralmente de topspin.
Drop volley (Voleio curto)|GO|Voleio amortecido que cai perto da rede, tirando a velocidade da bola.
Smash (Overhead)|GO|Golpe por cima da cabeça, semelhante ao saque, usado em lobs altos. É finalizador.
Bandeja (Slice overhead)|GO|Golpe por cima com slice, mais controlado que o smash. Muito comum no padel.
Smash em salto (Jump smash)|GO|Smash em suspensão, feito para alcançar lobs profundos sem recuar demais.
Tweener (Entre as pernas)|GO|Golpe dado entre as pernas, de costas para a rede, quando a bola passa do jogador. Mais espetacular do que prático.
Golpe em torno do poste (Around the post)|GO|Bola que passa por fora do poste da rede e não por cima dela, devolvendo a bola em um ponto abaixo da altura da rede.
Bola curta (Short ball)|GO|Bola que cai perto da rede ou na quadra frontal, geralmente uma oportunidade de ataque.
Bola funda (Deep ball)|GO|Bola que cai perto da linha de fundo e empurra o adversário para trás.
Bola pesada (Heavy ball)|GO|Bola com muito topspin e potência que quica alto e exige esforço do adversário para devolver.
Bola mole / Sitter|GO|Bola lenta e fácil de atacar, geralmente na altura ideal para o adversário bater.
Moonball (balão de ritmo)|GO|Bola muito alta e de baixa velocidade, que cai funda e tira o ritmo do oponente.
Cruzada (Cross-court)|GO|Golpe diagonal, que cruza a quadra de um lado a outro. É o mais seguro, pois a rede é mais baixa no centro e o caminho é mais longo.
Paralela (Down the line)|GO|Golpe pela lateral, paralelo à linha lateral. Arriscado, mas muda a direção do jogo.
Inside-out|GO|Forehand batido a partir do lado do backhand (contornando-o), dirigido em diagonal para o lado do forehand. Abre a quadra com o golpe mais forte.
Inside-in|GO|Forehand batido a partir do lado do backhand (contornando-o), dirigido paralelamente à linha lateral, no mesmo lado em que está o jogador.
Bola alta de ombro (High ball)|GO|Bola que quica à altura dos ombros ou acima. Exige adaptação da pegada e da posição.
Bola baixa (Low ball)|GO|Bola que passa perto do chão. Exige flexão de joelhos e face de raquete controlada.
Devolução em bloqueio (Block return)|GO|Devolução curta e firme, com pouco swing, para controlar saques fortes.
Chip and charge|GO|Devolução em slice curta seguida de subida imediata à rede, para pressionar o sacador.
Contra-ataque (Counterpunch)|GO|Usar a velocidade do adversário a seu favor, devolvendo a bola com direção e profundidade.
Golpe de definição (Putaway)|GO|Golpe finalizador que encerra o ponto, geralmente em bola curta ou fácil.
Take-back (Preparação / Backswing)|GO|Movimento da raquete para trás para preparar o golpe. Em golpes modernos é compacto e combinado com o giro do tronco.
Swing (Balanço)|GO|Movimento completo da raquete, do início à finalização.
Swing para frente (Forward swing)|GO|Fase em que a raquete vem em direção à bola, acelerando até o contato.
Ponto de contato (Contact point)|GO|Posição no espaço onde a raquete encontra a bola. No forehand, o ideal é à frente do corpo, na altura da cintura.
Finalização (Follow-through)|GO|Continuação do movimento após o contato. Reduz a carga no braço e define a direção e o efeito.
Limpador de para-brisa (Windshield wiper)|GO|Finalização do forehand moderno em que a raquete gira da direita para a esquerda após o contato, como um limpador de para-brisa.
Caminho do swing (Swing path)|GO|Trajetória da cabeça da raquete. Baixo-para-alto produz topspin; alto-para-baixo, slice.
Plano do swing (Swing plane)|GO|Plano em que o movimento da raquete se desenvolve. Em geral, inclinado para cima na frente do contato.
Bater com a bola subindo (Take it on the rise)|GO|Bater a bola logo depois do quique, quando ela está subindo, para ganhar tempo e pressionar o adversário.
Bater com a bola caindo|GO|Bater a bola no ponto mais baixo do arco, dando mais tempo, mas com menos agressividade.
Saque (Serve)|SA|Golpe que inicia o ponto, dado por cima da cabeça, de trás da linha de fundo, em direção ao quadrado diagonal.
Primeiro saque (First serve)|SA|Primeira tentativa. Costuma ser potente e agressiva, com margem de erro maior.
Segundo saque (Second serve)|SA|Segunda tentativa após uma falta. Costuma ter mais efeito (slice ou kick) e menos velocidade para evitar a dupla falta.
Saque chapado (Flat serve)|SA|Saque com pouco efeito, o mais rápido possível, batendo a bola de forma quase plana.
Saque com slice (Slice serve)|SA|Saque com efeito lateral, que curva a bola para o lado e a faz escapar do devolvedor, especialmente em quadras rápidas.
Saque kick (Kick serve / Topspin serve)|SA|Saque com topspin forte que faz a bola quicar alto e para o lado. Muito usado no segundo saque.
Saque e voleio (Serve and volley)|SA|Estilo em que o jogador saca e sobe à rede logo em seguida para finalizar o ponto com voleio.
Saque no T|SA|Saque dirigido ao T, no centro da quadra, perto da linha central de serviço.
Saque aberto (Wide serve)|SA|Saque dirigido ao canto externo do quadrado, empurrando o devolvedor para fora da quadra.
Saque no corpo (Body serve)|SA|Saque dirigido ao corpo do devolvedor, tirando espaço e ângulo de devolução.
Saque por baixo (Underhand serve)|SA|Saque dado por baixo do ombro, usado como surpresa tática ou por iniciantes.
Lançamento (Toss)|SA|Lançar a bola para cima antes de sacar. Sua posição e consistência definem o tipo de saque e a precisão.
Posição de troféu (Trophy position)|SA|Posição do saque em que o braço da raquete está para cima, o outro braço aponta a bola e os joelhos estão flexionados.
Queda da raquete (Racket drop)|SA|Momento em que a raquete cai atrás das costas antes de subir para o contato, alongando os músculos do ombro.
Impulsão no saque (Leg drive)|SA|Extensão dos joelhos e do tornozelo que impulsiona o corpo para cima e para frente no saque.
Posição de pés no saque (Platform / Pinpoint)|SA|Platform: pés lado a lado e parados. Pinpoint: pé de trás aproxima-se do da frente durante o movimento. Ambos são válidos.
Pronação do saque|SA|Rotação do antebraço no contato do saque, que vira a face da raquete e dá velocidade e efeito.
Ponto de contato do saque|SA|Altura em que a raquete encontra a bola, com o braço estendido. É o ponto mais alto possível, ligeiramente à frente do corpo.
Saque-devolução (Return of serve)|SA|Resposta ao saque. Exige antecipação, split step e movimento compacto.
Devolução (Return)|SA|Primeiro golpe depois do saque. É determinante para a quebra de serviço.
Devolução cruzada (Cross-court return)|SA|Devolução em diagonal, geralmente a mais segura, buscando profundidade.
Devolução agressiva|SA|Devolução com swing completo, tomando a iniciativa em segundo saques fracos.
Posição de devolução (Return stance)|SA|Posição do devolvedor ao receber o saque, com pés abertos e peso à frente, pronto para o split step.
Serve +1 (Saque mais um)|SA|Padrão tático que combina o saque com o golpe seguinte, para finalizar o ponto rapidamente.
Cadeia cinética (Kinetic chain)|BM|Sequência coordenada em que a energia sobe do solo pelas pernas, quadril, tronco, ombro, braço e raquete, de segmentos grandes para pequenos.
Sequência proximal-distal|BM|Princípio de que os segmentos mais próximos do centro do corpo aceleram primeiro e passam a energia aos mais distais, em sucessão.
Unit turn (Giro unitário)|BM|Giro simultâneo de ombros, quadril e raquete como um bloco, no início da preparação. Mantém a raquete à frente do peito e prepara a carga.
Giro de ombros (Shoulder turn)|BM|Rotação dos ombros para o lado do golpe, que alonga a musculatura do tronco e prepara a rotação.
Carga (Load / Loading)|BM|Flexão dos joelhos e transferência de peso para a perna de trás, armazenando energia elástica antes de explodir no golpe.
Ciclo alongamento-encurtamento (SSC)|BM|Pré-alongamento rápido dos músculos seguido de contração. Gera mais potência do que a contração sem pré-alongamento.
Pré-alongamento (Pre-stretch)|BM|Alongamento rápido que precede a contração concêntrica, ativando o reflexo miotático e a energia elástica.
Separação quadril-ombro (Hip-shoulder separation)|BM|Diferença angular entre a rotação do quadril e a dos ombros. Alongar essa diferença antes do golpe aumenta a potência.
X-factor|BM|Ângulo de separação entre quadril e ombros durante o golpe. Maior X-factor é associado a maior potência de rotação.
Lag da raquete (Racket lag)|BM|Atraso da cabeça da raquete em relação à mão e ao antebraço no início do swing, que armazena energia para soltá-la no contato.
Efeito chicote (Whip effect)|BM|Aceleração progressiva dos segmentos distais quando os proximais desaceleram, como a ponta de um chicote.
Transferência de energia|BM|Passagem de momento de um segmento corporal para o seguinte na cadeia cinética, de pernas ao braço e à raquete.
Força de reação do solo (Ground reaction force / GRF)|BM|Força que o chão devolve ao corpo ao ser empurrado. É a fonte inicial da potência dos golpes e do saque.
Força de pernas no solo (Leg drive)|BM|Extensão das pernas contra o chão que gera força de reação do solo e inicia a cadeia cinética.
Rotação do quadril (Hip rotation)|BM|Giro da pelve em torno do eixo vertical. É o primeiro grande pico de velocidade angular na cadeia cinética do golpe.
Rotação do tronco (Trunk rotation)|BM|Giro do tronco que sucede o do quadril e passa a energia para o ombro e o braço.
Rotação interna do ombro (Shoulder internal rotation)|BM|Rotação do úmero para dentro, que acelera fortemente o antebraço no forehand e no saque. Responsável por grande parte da velocidade da raquete.
Pronação do antebraço (Forearm pronation)|BM|Rotação do antebraço que vira a palma para baixo. No saque e no forehand, contribui para a velocidade da raquete no contato.
Supinação do antebraço (Forearm supination)|BM|Rotação do antebraço que vira a palma para cima. Presente no início do movimento de queda da raquete.
Extensão do cotovelo (Elbow extension)|BM|Esticar o cotovelo na aceleração, que adiciona velocidade à raquete nos golpes por cima da cabeça (saque e smash) e no forehand.
Desvio ulnar / radial|BM|Movimentos laterais do punho em direção ao dedo mínimo (ulnar) ou polegar (radial). Participam da aceleração da cabeça da raquete.
Flexão de punho (Wrist flexion)|BM|Dobrar o punho para a palma, adiciona velocidade no fim do swing, em saque e smash.
Extensão de punho (Wrist extension)|BM|Dobrar o punho para trás. Usado no backhand de uma mão e na preparação do forehand para criar lag.
Core (Centro corporal)|BM|Musculatura do abdômen, lombar, oblíquos e quadril, que estabiliza o tronco e transfere força das pernas aos braços.
Centro de massa (Center of mass)|BM|Ponto de equilíbrio do corpo, próximo ao umbigo. Manter o centro de massa dentro da base de apoio dá estabilidade.
Base de apoio (Base of support)|BM|Área entre os pés que sustenta o corpo. Uma base larga aumenta estabilidade; uma estreita aumenta mobilidade.
Transferência de peso (Weight transfer)|BM|Movimento do peso do corpo da perna de trás para a da frente durante o golpe, somando massa à velocidade da raquete.
Equilíbrio dinâmico|BM|Capacidade de manter o equilíbrio em movimento, essencial para bater a bola em corrida e recuperar posição.
Momento angular (Angular momentum)|BM|Quantidade de rotação de um corpo, que depende de massa, distribuição e velocidade angular. É conservado e transferido entre segmentos.
Velocidade angular|BM|Rapidez com que um segmento gira, em graus por segundo. Picos sequenciais de velocidade angular caracterizam a cadeia cinética.
Torque|BM|Força que causa rotação. Os músculos geram torque nas articulações para acelerar os segmentos.
Fase excêntrica / concêntrica|BM|Excêntrica: o músculo alonga sob carga (freia). Concêntrica: o músculo encurta (acelera). Ambos acontecem em sequência no golpe.
Fases do golpe|BM|Preparação, aceleração, contato e finalização (desaceleração). Cada fase tem objetivos mecânicos diferentes.
Velocidade da cabeça da raquete (Racket head speed)|BM|Velocidade com que a cabeça da raquete atinge a bola. É o principal determinante da velocidade e do spin.
Ângulo da face (Racket face angle)|BM|Inclinação da face em relação ao chão no contato. Define a direção vertical da bola e o spin.
Efeito Magnus|BM|Força lateral que age sobre uma bola em rotação no ar. É por isso que o topspin faz a bola cair e o backspin a mantém no ar.
Tempo de contato (Dwell time)|BM|Duração do contato entre bola e cordas, cerca de 4 a 5 milissegundos em golpes de fundo.
Impacto fora do centro (Off-center hit)|BM|Contato fora do ponto doce, que reduz potência e aumenta vibração e a torção da raquete.
Vibração (Vibration)|BM|Oscilação do quadro após o impacto. Impactos fora do centro e cordas rígidas aumentam a vibração transmitida ao braço.
Centro de percussão|BM|Ponto da raquete onde o impacto minimiza o choque sentido na mão. Fica perto do ponto doce.
Postura atlética (Athletic stance)|BM|Posição de preparo com joelhos levemente flexionados, tronco inclinado à frente e peso nas bolas dos pés.
Posição de espera (Ready position)|BM|Postura em que o jogador aguarda a bola, com pés abertos na largura dos ombros, joelhos flexionados e raquete à frente.
Postura aberta (Open stance)|BM|Pés quase paralelos à linha de fundo no contato. Facilita rotação e recuperação, e é típica do forehand moderno.
Postura semi-aberta (Semi-open stance)|BM|Pés em ângulo intermediário, com o pé de trás ligeiramente atrás. Equilibra potência e rotação.
Postura neutra (Neutral stance)|BM|Pés em linha com a trajetória da bola, com o pé da frente avançando em direção à bola.
Postura fechada (Closed stance)|BM|Pé da frente cruza à frente do outro, dando alcance, mas limitando a rotação do quadril.
Braço livre (Non-hitting arm)|BM|Braço que não segura a raquete. Ajuda a girar, equilibrar e apontar a bola, e recolher-se para acelerar a rotação.
Contrapeso (Counterbalance)|BM|Movimento do braço livre ou do corpo que compensa o movimento da raquete para manter o equilíbrio.
Extensão completa (Full extension)|BM|Braço esticado no contato do saque ou do smash, que maximiza altura e alcance.
Rotação externa do ombro|BM|Giro do úmero para fora, como na queda da raquete no saque, que prepara a rotação interna explosiva.
Retração escapular|BM|Movimento das escápulas para trás e para dentro, importante na preparação e na estabilidade do ombro.
Estabilidade escapular|BM|Controle das escápulas pelos músculos do manguito e das costas. Protege o ombro nos golpes repetitivos.
Ritmo do golpe (Timing)|BM|Coordenação temporal dos segmentos na cadeia cinética. Pequenos atrasos ou adiantamentos mudam a potência e o controle.
Golpe em suspensão (Jump hit)|BM|Golpe dado com os dois pés fora do chão. Permite bater com a bola alta, mas reduz o contato com o solo e a estabilidade.
Rotação dos pés (Pivot)|BM|Giro do pé de apoio que acompanha a rotação do quadril para evitar tensão no joelho e liberar a pelve.
Split step (Passo de preparação)|JP|Pequeno salto ou "pulinho" feito no instante em que o adversário bate a bola. Pré-ativa as pernas para reagir rápido em qualquer direção.
Primeiro passo (First step)|JP|Primeiro movimento depois do split step, na direção da bola. É decisivo para chegar a tempo com equilíbrio.
Passos de ajuste (Adjustment steps)|JP|Pequenos passos finais para acertar a distância da bola e preparar o contato.
Passo lateral (Side step / Shuffle)|JP|Deslocamento lateral curto, sem cruzar os pés, usado para pequenas distâncias.
Passo cruzado (Crossover step)|JP|Passo em que o pé de trás cruza à frente do outro para acelerar em corridas laterais mais longas.
Passo carioca (Carioca / Grapevine)|JP|Deslocamento lateral com cruzamento alternado dos pés, usado como exercício de coordenação e agilidade.
Passo de abertura (Drop step / Jab step)|JP|Passo inicial que abre o quadril na direção da bola, para iniciar a corrida sem perder tempo.
Passo de recuperação (Recovery step)|JP|Passos depois do golpe que levam o jogador de volta à posição central de espera.
Posição central (Home position)|JP|Posição ideal na linha de fundo para voltar após cada golpe, equilibrada entre os ângulos possíveis do adversário.
Antecipação (Anticipation)|JP|Leitura prévia da direção, do efeito e da profundidade da bola, com base na postura e no swing do adversário.
Reação (Reaction time)|JP|Tempo entre o estímulo (bola do adversário) e a resposta motora. Treinável com exercícios de reação.
Deslize (Slide)|JP|Deslizar o pé no chão ao parar, técnica típica do saibro que reduz o esforço de frenagem e permite continuar o movimento.
Corrida lateral (Lateral movement)|JP|Deslocamento para os lados, base do jogo de fundo. Depende de agilidade, força e equilíbrio.
Sprint curto|JP|Corrida explosiva de poucos metros, por exemplo para uma curtinha ou aproximação.
Frenagem (Deceleration)|JP|Parar o corpo em movimento antes do golpe. Exige força excêntrica de pernas e controle do tronco.
Pés ativos|JP|Estar em movimento constante, com pequenos passos, antes e depois do golpe. Evitar ficar parado em "pé fixo".
Agilidade (Agility)|JP|Capacidade de mudar de direção rapidamente com controle. Medida em testes como 5-10-5 e T-test.
Pliometria (Plyometrics)|JP|Treino de saltos e movimentos explosivos que melhora potência e rapidez de reação das pernas.
Salto vertical (Vertical jump)|JP|Medida da potência de pernas. Importante para o saque e o smash.
Cross-court (Cruzada)|TA|Bola jogada na diagonal. Tática básica: a rede mais baixa e a trajetória mais longa dão mais margem.
Down the line (Paralela)|TA|Bola jogada ao longo da linha lateral. Usada para mudar a direção do jogo e surpreender.
Padrão de jogo (Pattern)|TA|Sequência de golpes planejada, como cruzado-cruzado-paralela, para criar vantagem.
Construção do ponto (Point construction)|TA|Planejar os golpes sucessivos para abrir a quadra e finalizar com segurança.
Quadra aberta (Open court)|TA|Espaço vazio no lado oposto da quadra, onde se pode finalizar quando o adversário está deslocado.
Pé errado (Wrong-foot)|TA|Fazer o adversário se deslocar para um lado e então bater para o lado oposto, deixando-o sem reação.
Profundidade (Depth)|TA|Bater a bola perto da linha de fundo adversária. Mantém o adversário recuado e sem ângulos.
Margem (Margin)|TA|Distância de segurança sobre a rede e para as linhas. Mais margem reduz erros.
Altura sobre a rede (Net clearance)|TA|Altura pela qual a bola passa acima da rede. Maior margem aumenta a segurança, mas dá mais tempo ao adversário.
Variação de ritmo (Change of pace)|TA|Alterar velocidade, efeito, altura e profundidade para tirar o adversário do conforto.
Neutralizar (Neutralize)|TA|Defender um golpe agressivo, devolvendo com profundidade, sem arriscar, para voltar ao ponto neutro.
Tomar a iniciativa (Take initiative)|TA|Atacar primeiro, dirigindo o ritmo do ponto em vez de apenas reagir.
Primeira bola agressiva (First strike)|TA|Estilo de jogo que busca finalizar nos dois primeiros golpes depois do saque ou da devolução.
Jogador de fundo (Baseliner)|TA|Jogador que passa a maior parte do jogo na linha de fundo, construindo pontos com golpes de base.
Agressivo de fundo (Aggressive baseliner)|TA|Baseliner que busca finalizar o ponto com golpes potentes, ainda da linha de fundo.
Contra-atacante (Counterpuncher)|TA|Jogador defensivo e consistente que devolve tudo e espera o erro ou a abertura do adversário.
Jogador completo (All-courter)|TA|Jogador versátil, que combina golpes de fundo, jogo de rede e variações.
Sacador-voleador (Serve-and-volleyer)|TA|Jogador que saca e sobe à rede de imediato. Estilo clássico, hoje raro no circuito.
Empurrador (Pusher)|TA|Jogador que devolve tudo com pouca potência, esperando erros. Frustrante para quem tenta atacar.
Saque potente (Big server)|TA|Jogador cujo saque é a principal arma, com muitos aces e games rápidos.
Subida à rede (Net approach)|TA|Avançar para a rede para finalizar com voleio ou smash. Funciona melhor após bola curta ou aproximação profunda.
Zona de ataque|TA|Região da quadra em que o jogador pode atacar com segurança, geralmente na linha de serviço ou à frente dela.
Plano A / B / C|TA|Planos táticos alternativos. Se o plano A não funciona, ajusta-se para o B e depois para o C.
Pontos importantes (Big points)|TA|Break points, set points e match points, em que a pressão aumenta e a escolha tática ganha peso.
Momentum|TA|Sensação de domínio do jogo, que muda a confiança e o resultado. Pode se perder rapidamente em jogos equilibrados.
Observação do adversário (Scouting)|TA|Identificar padrões, pontos fracos e forças do adversário antes e durante a partida.
Duplas (Doubles)|TA|Modalidade com dois jogadores por lado. A quadra é mais larga e o jogo de rede é decisivo.
Formação "I" (I-formation)|TA|Em duplas, o parceiro do sacador se agacha no centro, perto da rede, e sinaliza por onde vai se mover.
Formação australiana|TA|Em duplas, sacador e parceiro ficam do mesmo lado da quadra para forçar a devolução cruzada.
Invadir (Poach)|TA|Em duplas, o jogador da rede cruza a frente para interceptar a bola, surpreendendo o adversário.
Um sobe, um fica (One up, one back)|TA|Formação de duplas em que um jogador fica na rede e o outro, no fundo.
Dois na rede (Both up)|TA|Formação de duplas ofensiva, com ambos os jogadores na rede para pressionar.
Dois no fundo (Both back)|TA|Formação defensiva de duplas, em que ambos ficam na linha de fundo.
Comunicação em duplas|TA|Sinais e combinações entre os parceiros, como "meu", "seu", "troca" e sinais de mão antes do saque.
Treino (Practice)|TR|Atividade estruturada para melhorar uma habilidade específica, com objetivos claros e feedback.
Drill|TR|Exercício repetitivo com regras específicas, desenhado para trabalhar um aspecto técnico, tático ou físico.
Cesto (Basket feeding)|TR|Treinador alimenta bolas de um cesto, em ritmo e direção controlados, para repetição técnica.
Multi-ball|TR|Treino em que o treinador alimenta várias bolas seguidas, sem pausas, permitindo repetição de alta intensidade.
Rali de treino (Hitting / Rallying)|TR|Troca de bolas descontraída com parceiro para aquecer ou treinar consistência.
Mini-tênis (Mini tennis)|TR|Rali na área de serviço, com bolas macias e curtas. Treina toque, controle e aquecimento.
Shadow swing (Golpe de sombra)|TR|Repetir o movimento do golpe sem bola, focando em técnica e fluidez, geralmente à frente de um espelho.
Paredão (Wall practice)|TR|Treino batendo a bola contra um muro. Ótimo para repetições, reação e consistência individuais.
Treino de alvos (Target practice)|TR|Exercício em que se busca acertar zonas marcadas por cones, toalhas ou linhas.
Treino em circuito (Circuit training)|TR|Sequência de estações com exercícios variados, com pouca pausa. Usado para condicionamento.
Treino de reação|TR|Exercícios em que o jogador responde a estímulos inesperados, como bolas de ricochete.
Escada de agilidade (Agility ladder)|TR|Escada no chão para treinar passos curtos, rápidos e coordenados.
Periodização (Periodization)|TR|Organização do treino em ciclos (macro, meso e microciclos) para alcançar o pico de forma em datas de competição.
Sobrecarga progressiva (Progressive overload)|TR|Aumentar gradualmente a carga de treino para estimular adaptação sem lesionar.
Volume / Intensidade|TR|Volume: quantidade total de treino (horas, repetições). Intensidade: esforço em cada sessão. Trade-off clássico do planejamento.
Descarga (Deload)|TR|Semana de volume reduzido para permitir recuperação e evitar excesso de treino.
Percepção de esforço (RPE)|TR|Escala subjetiva de 1 a 10 de quão difícil foi a sessão. Útil para ajustar cargas.
Aquecimento dinâmico (Dynamic warm-up)|TR|Movimentos como skipping, rotações e corridas curtas que elevam a temperatura e preparam o corpo para jogar.
Volta à calma (Cool-down)|TR|Atividade leve e alongamento depois do treino para normalizar frequência cardíaca e favorecer a recuperação.
Mobilidade (Mobility)|TR|Amplitude de movimento ativa nas articulações. Importante para tórax, ombros, quadril e tornozelos.
Alongamento estático / dinâmico|TR|Estático: segurar uma posição. Dinâmico: movimentos controlados em amplitude progressiva. O dinâmico é indicado antes de jogar.
Treino de força (Strength training)|TR|Exercícios com carga para ganhar força muscular. Essencial para potência de golpes e prevenção de lesões.
Potência (Power)|TR|Força aplicada rapidamente. É o que dá velocidade a saque e golpes.
Resistência aeróbica (Aerobic endurance)|TR|Capacidade de sustentar esforço prolongado, importante em partidas longas e na recuperação entre pontos.
Resistência anaeróbica|TR|Capacidade de repetir esforços intensos curtos, como os pontos de tênis, com pouca pausa.
Treino intervalado (HIIT)|TR|Séries de esforço intenso alternadas com pausas, adequado ao padrão de esforço do tênis.
Recuperação ativa|TR|Atividade leve (caminhada, bicicleta) para acelerar recuperação depois de esforços intensos.
Rotina entre pontos (Between-point routine)|TR|Sequência de comportamentos (respirar, ajustar cordas, olhar para as cordas) que organiza foco entre um ponto e outro.
Visualização (Visualization)|TR|Imaginar mentalmente a execução do golpe ou o plano tático. Reforça padrões motores.
Respiração (Breathing)|TR|Respirações profundas e controladas entre pontos para reduzir tensão e ansiedade.
Foco (Focus)|TR|Atenção voltada à tarefa do momento (a bola, o plano tático) em vez do placar ou do resultado.
Autodiálogo (Self-talk)|TR|Conversa interna do jogador. Instruções positivas e curtas ajudam a manter o foco.
Fluxo (Flow / In the zone)|TR|Estado mental de total imersão e execução fluida, sem excesso de pensamento.
Travar (Choking)|TR|Queda de desempenho sob pressão, com tensão muscular excessiva e dúvida. Trabalhável com rotina mental.
Cotovelo de tenista (Tennis elbow)|CS|Dor no lado de fora do cotovelo (epicondilite lateral) por sobrecarga dos extensores do punho, comum em backhands e em cordas rígidas.
Cotovelo de golfista (Golfer's elbow)|CS|Dor no lado de dentro do cotovelo (epicondilite medial), comum no saque e no forehand.
Tendinite (Tendinitis)|CS|Inflamação ou sobrecarga de um tendão por uso repetitivo, como o do ombro, cotovelo ou punho.
Manguito rotador (Rotator cuff)|CS|Conjunto de quatro músculos que estabilizam o ombro. Lesionado com frequência pelo saque e smash repetitivos.
Impacto do ombro (Shoulder impingement)|CS|Compressão de tendões sob o acrômio, causando dor ao elevar o braço, como no saque.
Entorse de tornozelo (Ankle sprain)|CS|Lesão dos ligamentos do tornozelo, comum por pisadas inadequadas ou mudanças de direção bruscas.
Fascite plantar (Plantar fasciitis)|CS|Dor na sola do pé, perto do calcanhar, por sobrecarga da fáscia. Comum com calçados inadequados.
Tendinite de Aquiles (Achilles tendinopathy)|CS|Dor no tendão do calcanhar, associada a saltos, sprints e aumento rápido do volume de treino.
Joelho de saltador (Patellar tendinopathy)|CS|Dor abaixo da patela por sobrecarga em saltos e aceleração.
Lesão de menisco / LCA|CS|Lesões do joelho (menisco ou ligamento cruzado anterior) frequentes em freadas e giros com o pé fixo no chão.
Lombalgia (Low back pain)|CS|Dor lombar associada à hiperextensão no saque, rotações repetidas e falta de estabilidade do core.
Bolhas (Blisters)|CS|Lesão da pele por fricção, comum nos pés e na mão. Prevenir com meias técnicas, calçado adequado e grips secos.
Câimbra (Cramp)|CS|Contração involuntária e dolorosa de um músculo, comum em jogos longos por desidratação, fadiga ou perda de sais minerais.
Fratura por estresse (Stress fracture)|CS|Pequena fissura no osso por sobrecarga repetitiva, mais comum nos pés e na lombar.
Lesão por uso excessivo (Overuse injury)|CS|Dor ou lesão gerada por sobrecarga repetida sem recuperação adequada.
Hidratação (Hydration)|CS|Reposição de água e sais minerais durante e após o jogo. A perda de apenas 2% do peso por suor já reduz o desempenho.
Nutrição esportiva|CS|Alimentação planejada com carboidratos, proteínas e gorduras em quantidade adequada para o esforço e a recuperação.
Sono (Sleep)|CS|Fator essencial de recuperação, ligado a desempenho, reação e prevenção de lesões.
Prevenção de lesões|CS|Conjunto de práticas como aquecimento, força, mobilidade, planejamento de carga e uso de equipamento adequado.
PRICE / POLICE|CS|Protocolos iniciais de lesão aguda: proteção, descanso/carga otimizada, gelo, compressão e elevação. Deve ser seguido de avaliação profissional.
Fisioterapia (Physical therapy)|CS|Tratamento e reabilitação com exercícios e técnicas para tratar lesões e prevenir recorrência.
Pronação do pé (Foot pronation)|CS|Movimento natural do pé ao apoiar. Muita pronação ou supinação pode exigir tênis ou palmilhas específicos.
Raquetada|GI|Golpe forte ou mal controlado dado com a raquete. Pode também se referir a um golpe dado com agressividade.
Bola na linha|GI|Bola que cai exatamente sobre a linha, considerada boa. Gíria para precisão.
Matar o ponto|GI|Finalizar o ponto com um golpe decisivo, geralmente na rede.
Esticar o rali|GI|Manter a bola em jogo por muito tempo, prolongando o ponto.
Entregar o ponto|GI|Errar facilmente ou devolver uma bola fácil, dando o ponto ao adversário.
Subir pra rede|GI|Avançar para a rede, abandonando a linha de fundo.
Vamos! (Come on!)|GI|Exclamação de incentivo própria, usada para ganhar energia e foco.
Out! / Fora!|GI|Chamada de bola fora, feita pelo jogador ou pelo juiz de linha.
Let! / Repete!|GI|Chamada de ponto a ser repetido, por exemplo, quando a bola toca a rede no saque.
Game, set, match|GI|Frase final do árbitro que anuncia o fim da partida e o vencedor.
Chapar|GI|Gíria para bater a bola sem efeito, plana e forte.
Slice-and-dice|GI|Estilo de jogo baseado em slices variados, variações de ritmo e trocas de altura para desorganizar o adversário.
Clutch|GI|Jogador que performa nos momentos decisivos. Oposto de quem "trava".
Grinder|GI|Jogador que vence no desgaste, com muita regularidade e resistência física.
Hawk-Eye Live|TD|Sistema de chamadas automáticas em tempo real que dispensa os juízes de linha.
Radar de saque (Radar gun)|TD|Medidor que registra a velocidade do saque em km/h. O valor depende de onde na trajetória a bola é medida.
Sensor de raquete (Racket sensor)|TD|Dispositivo no cabo que mede velocidade de swing, tipo de golpe e ponto de impacto.
Análise de vídeo (Video analysis)|TD|Gravação e revisão em câmera lenta de golpes para corrigir técnica. Um dos recursos mais acessíveis.
Captura de movimento (Motion capture)|TD|Sistema com câmeras e marcadores que registra o movimento 3D do corpo. Base de muitos estudos biomecânicos.
Plataforma de força (Force plate)|TD|Plataforma que mede a força de reação do solo durante saques e golpes.
Eletromiografia (EMG)|TD|Medida da atividade elétrica dos músculos. Mostra quando e quanto cada músculo é ativado no golpe.
Estatísticas de partida|TD|Registros como aces, % de primeiros saques, pontos ganhos no saque, break points convertidos e winners/erros.
Porcentagem de primeiro saque (1st serve %)|TD|Proporção de primeiros saques que entram. Valores entre 55% e 70% são comuns nos profissionais.
Pontos ganhos no primeiro saque|TD|Porcentagem de pontos vencidos quando o primeiro saque entra. Nos profissionais fica geralmente entre 70% e 80%.
Break points convertidos|TD|Razão entre break points transformados em quebras e o total de break points disputados.
Mapa de calor (Heatmap)|TD|Visualização da distribuição de bolas, deslocamentos ou pontos de impacto na quadra.
Probabilidade de vitória (Win probability)|TD|Estimativa estatística de quem vencerá, atualizada a cada ponto, a partir de modelos de dados.
Quadríceps|BM|Grupo muscular da frente da coxa. Estende o joelho e freia o corpo nas paradas, sendo a base do impulso das pernas.
Isquiotibiais (Hamstrings)|BM|Músculos da parte de trás da coxa. Estendem o quadril, freiam a corrida e protegem o joelho.
Glúteos (Gluteals)|BM|Músculos do quadril e da nádega. Principais geradores de potência para rotação e extensão do quadril.
Oblíquos (Obliques)|BM|Músculos laterais do abdômen que giram e estabilizam o tronco. Chave para a rotação nos golpes e no saque.
Reto abdominal|BM|Músculo frontal do abdômen. Flexiona o tronco e transfere força no saque e no smash.
Latíssimo do dorso (Latissimus dorsi)|BM|Grande músculo das costas, que puxa o braço para baixo e para trás, importante na aceleração do saque.
Peitoral maior (Pectoralis major)|BM|Músculo do peito que gira internamente o ombro e leva o braço à frente no forehand e no saque.
Deltoide (Deltoid)|BM|Músculo do ombro que eleva e estabiliza o braço. A parte posterior desacelera o braço depois do contato.
Tríceps|BM|Músculo posterior do braço, que estende o cotovelo na aceleração do saque e do smash.
Trapézio (Trapezius)|BM|Músculo das costas e pescoço que estabiliza a escápula. Sobrecarregado por má postura e tensão.
Flexores do punho|BM|Músculos da parte interna do antebraço que flexionam o punho e fecham a mão. Muito ativos no saque e no forehand.
Extensores do punho|BM|Músculos da parte externa do antebraço que mantêm o punho estável no contato. Sobrecarregados no cotovelo de tenista.
Panturrilha (Calf / Gastrocnêmio e sóleo)|BM|Músculos da perna que dão impulso nos saltos e nas arrancadas, e absorvem impacto em paradas.
Co-contração|BM|Ativação simultânea de músculos opostos para dar estabilidade articular, como na pegada firme no impacto.
Propriocepção (Proprioception)|BM|Sensação da posição do corpo no espaço, essencial para equilíbrio e coordenação fina da raquete.
Reflexo miotático (Stretch reflex)|BM|Contração automática de um músculo quando é alongado rapidamente, que contribui para a potência no ciclo alongamento-encurtamento.
Pré-ativação muscular|BM|Ativação dos músculos antes do impacto para preparar a articulação. Reduz a absorção de choque no braço.
Punho firme (Firm wrist)|BM|Manter o punho estável durante o contato, em voleios e bloqueios, para controlar a face e evitar vibração.
Punho solto (Loose wrist)|BM|Punho relaxado no início do swing, para permitir lag e aceleração. Fecha-se antes do contato.
Frente do corpo (Contact in front)|BM|Princípio de bater a bola à frente do tronco, o que dá mais controle, ângulo e potência.
Pivô do pé de trás (Back foot pivot)|BM|Giro do pé de trás ao acelerar o quadril, que permite transferir peso e gerar rotação.
Empurrar o chão (Push off)|BM|Usar o pé para empurrar o chão e iniciar o movimento de corrida, salto ou saque.
Salto de tesoura (Scissor kick)|BM|Chute com as pernas no ar durante o smash em salto ou no saque, que equilibra a rotação do tronco.
Posição do cotovelo (Elbow position)|BM|Posição do cotovelo em relação ao tronco ao longo do golpe. No forehand moderno, o cotovelo fica perto do corpo e à frente.
Elasticidade muscular|BM|Capacidade de tendões e músculos armazenarem energia ao serem alongados e devolvê-la ao encurtar.
Aceleração (Acceleration)|BM|Aumento de velocidade. No golpe, a raquete acelera continuamente até o contato, não depois.
Desaceleração (Deceleration)|BM|Frenagem do braço depois do contato, controlada por músculos posteriores do ombro. Má desaceleração aumenta o risco de lesão.
Energia elástica|BM|Energia armazenada em tendões e fáscias quando alongados, usada para dar potência ao golpe.
Eixo de rotação (Axis of rotation)|BM|Linha em torno da qual o corpo gira. Na rotação do tronco, é a coluna vertebral.
Plano sagital / frontal / transversal|BM|Planos do corpo: sagital divide esquerda e direita; frontal, frente e trás; transversal, alto e baixo. A rotação do golpe é no transversal.
Momento de inércia|BM|Resistência de um corpo a mudar sua rotação. Braço e raquete estendidos têm inércia maior que braço encolhido.
Conservação do momento angular|BM|Princípio que explica por que a velocidade de rotação aumenta quando se recolhe o braço livre ou se aproximam os segmentos.
Era Aberta (Open Era)|TO|Período iniciado em 1968, em que profissionais e amadores passaram a disputar os mesmos torneios.
Número 1 do mundo (World No. 1)|TO|Jogador na primeira posição do ranking. Chegar ao topo exige consistência ao longo de todas as superfícies.
Career Grand Slam|TO|Conquistar os quatro Grand Slams ao longo da carreira, mesmo em anos diferentes.
Golden Slam|TO|Vencer os quatro Grand Slams e a medalha de ouro olímpica no mesmo ano. Feito de pouquíssimos jogadores.
Calendar Slam|TO|Vencer os quatro Grand Slams dentro do mesmo ano civil.
Quadra central (Center court)|TO|Quadra principal de um torneio, geralmente com maior capacidade e onde ocorrem as finais.
Sessão noturna (Night session)|TO|Jogos em horário noturno, comuns em Grand Slams, com condições diferentes do dia (temperatura e velocidade).
Cerimônia do cara ou coroa (Coin toss)|TO|Sorteio inicial que define quem escolhe sacar, devolver ou o lado da quadra.
Aquecimento da partida (Warm-up)|TO|Cinco minutos permitidos antes do início da partida para trocar bolas e treinar saques.
Atrasar o jogo (Time violation)|TO|Infração por demorar além do tempo permitido entre pontos. Gera aviso e depois perda de ponto.
Raquete quebrada (Racket abuse)|TO|Quebrar ou jogar a raquete é infração do código de conduta e pode levar a aviso ou penalidade.
Patrocinador (Sponsor)|TO|Empresa que apoia o jogador financeiramente em troca de exposição de marca.
Prêmio em dinheiro (Prize money)|TO|Valor pago por rodada alcançada nos torneios, aumentando com o avanço na chave.
Academia (Tennis academy)|TO|Centro de formação com treino técnico, tático, físico e escolar para jovens atletas.
Técnico (Coach)|TO|Profissional que orienta o treino técnico, tático e mental do jogador.
Preparador físico (Fitness coach)|TO|Responsável por planejar o condicionamento, a força, a mobilidade e a prevenção de lesões.
Fisioterapeuta de circuito|TO|Profissional que acompanha o jogador em torneios para tratar e prevenir lesões.
Scouting report|TO|Relatório sobre o adversário, com padrões de jogo, direção do saque e pontos fracos.
Grafite (Graphite)|EQ|Material de fibra de carbono usado nos quadros das raquetes modernas, leve e rígido.
Fibra de carbono (Carbon fiber)|EQ|Material compósito de alta rigidez e baixo peso usado em raquetes e componentes.
Raquete de potência (Power racket)|EQ|Raquete leve, de cabeça grande e rígida, que facilita a potência com pouco esforço. Boa para iniciantes.
Raquete de controle (Control racket)|EQ|Raquete mais pesada, de cabeça menor e perfil fino, para jogadores avançados com swing completo.
Raquete tweener|EQ|Raquete intermediária entre as de potência e de controle, de peso médio e cabeça de tamanho moderado.
Flexão do quadro (Frame flex)|EQ|Quanto o quadro dobra no impacto. Quadros mais flexíveis absorvem choque, mas dão menos estabilidade.
Sistema de fixação das cordas (Mounting system)|EQ|Método para prender a raquete na máquina de encordoar. Influencia a precisão da tensão.
Tensão de referência (Reference tension)|EQ|Tensão recomendada pelo fabricante para uma raquete, ponto de partida para ajustes.
Cordas gastas (Worn strings)|RC|Cordas que perderam elasticidade, com entalhes visíveis, que reduzem o controle e podem arrebentar.
Entalhe de cordas (Notching)|RC|Pequenos cortes nas cordas pelo atrito das cordas cruzadas, indicando que a corda está chegando ao fim da vida útil.
Bola de espuma (Foam ball)|BO|Bola de espuma usada na iniciação e em treinos em espaços reduzidos. Mais lenta e segura.
Bola de treino (Practice ball)|BO|Bola mais barata e durável, usada em cestos de treino, geralmente com pressão reduzida.
Passo para dentro (Step-in)|JP|Avançar para dentro da quadra para bater a bola logo após o quique, ganhando tempo e ângulo.
Peso à frente (Forward momentum)|JP|Transferência do peso corporal para a frente durante o golpe, o que adiciona potência e estabilidade.
Pés largos (Wide base)|JP|Posição com pés bem afastados, que aumenta estabilidade em golpes difíceis e na devolução de saque.
Recuperação defensiva|JP|Voltar rápido ao centro depois de um golpe defensivo, geralmente com passos cruzados.
Corrida para trás (Backpedal)|JP|Deslocamento para trás, usado em lobs curtos. Quando a bola é muito alta, vira-se e corre-se de lado.
Giro lateral para o smash|JP|Virar de lado e recuar com passos laterais ou cruzados para se posicionar sob o lob.
Voleio de bloqueio (Punch volley)|GO|Voleio firme, com swing curto e pouca preparação, que devolve a velocidade do adversário com controle.
Voleio de reflexo (Reflex volley)|GO|Voleio rápido e quase sem preparação, dado em bolas que chegam muito perto do corpo.
Lob de voleio (Lob volley)|GO|Voleio alto que passa por cima de um adversário na rede, dado também na rede.
Voleio defensivo|GO|Voleio de recuperação, dado de trás ou de baixo, com o objetivo de manter a bola em jogo.
Slice de forehand|GO|Forehand cortado, menos comum que o de backhand, mas usado em bolas baixas ou para variar o ritmo.

const TTS={on:hbLS('ttson',hbLS('hbvoice',true)),rate:hbLS('ttsrate',hbLS('hbrate',1))};
const TTS_RATES=[.8,1,1.2,1.5];
function ttsStop(){if(window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('.sp').forEach(x=>x.classList.remove('sp'))}
function ttsSpeak(text,el){
  if(!('speechSynthesis' in window)||!text)return;
  const was=!!(el&&el.classList.contains('sp'));
  ttsStop();if(was)return;
  const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=TTS.rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt'));if(v)u.voice=v;
  if(el)el.classList.add('sp');const done=()=>{if(el)el.classList.remove('sp')};u.onend=done;u.onerror=done;
  speechSynthesis.speak(u);
}
function ttsText(el){
  if(el.dataset.tts)return el.dataset.tts;
  const kids=[...el.children].filter(c=>!c.matches('.tts-ctl,button'));
  const parts=(kids.length?kids.map(c=>c.textContent):[el.textContent]).map(t=>t.trim()).filter(Boolean);
  return parts.map(t=>/[.!?:;]$/.test(t)?t:t+'.').join(' ');
}
function ttsCtl(){return `<span class="tts-ctl"><button class="tts-b${TTS.on?' on':''}" data-ttsb="on" aria-label="Ler texto ao tocar" title="Ler texto ao tocar">🔊</button><button class="tts-b" data-ttsb="rate" aria-label="Velocidade da voz" title="Velocidade da voz">${TTS.rate}x</button></span>`}
function ttsSync(){document.querySelectorAll('[data-ttsb="on"]').forEach(b=>b.classList.toggle('on',TTS.on));document.querySelectorAll('[data-ttsb="rate"]').forEach(b=>b.textContent=TTS.rate+'x')}
function ttsToggle(){TTS.on=!TTS.on;hbSV('ttson',TTS.on);if(!TTS.on)ttsStop();ttsSync()}
function ttsCycle(){TTS.rate=TTS_RATES[(TTS_RATES.indexOf(TTS.rate)+1)%TTS_RATES.length]||1;hbSV('ttsrate',TTS.rate);ttsSync()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ttsb]');
  if(b){e.stopPropagation();if(b.dataset.ttsb==='on')ttsToggle();else ttsCycle();renderMainMenu();return}
  const all=e.target.closest('[data-ttsall]');
  if(all){if(!TTS.on)return;const r=document.querySelector(all.dataset.ttsall);if(r)ttsSpeak([...r.querySelectorAll('.tts')].map(ttsText).join(' '),all);return}
  if(!TTS.on)return;
  const el=e.target.closest('.tts');if(!el||e.target.closest('button,a,input,summary'))return;
  ttsSpeak(ttsText(el),el);
});

function tacArrive(i,anim){
  const s=TR.s,a=s.steps[i],n=s.steps.length;TR.i=i;tacRender(i,0);
  if(a.bn&&!TR.bn.some(q=>q[0]===a.ball[0]&&q[1]===a.ball[1])){TR.bn.push(a.ball);tacBounceMark(a.ball)}
  TR.trail.push(a.ball);tacTrailDraw();tacInfo(i);
  if(anim){tacSound(a);tacHitRing(a)}
  if(!TR.playing)return;
  if(i>=n-1){TR.playing=false;tacBtn();return}
  const tok=++TR.tok;tacNarrate(a.vo,()=>{if(!TR.playing||tok!==TR.tok)return;TR.el=0;TR.last=0;TR.raf=requestAnimationFrame(tacTick.bind(null,i,tok))},tok);
}
function tacTick(i,tok,now){
  if(!TR.playing||tok!==TR.tok)return;if(!TR.last)TR.last=now;TR.el+=now-TR.last;TR.last=now;
  const D=TR.plan[i].D*1000/TR.speed,f=Math.min(1,TR.el/D);tacRender(i,f);
  if(f>=1){tacArrive(i+1,true);return}
  TR.raf=requestAnimationFrame(tacTick.bind(null,i,tok));
}

// Gestos no Canvas: 1 dedo rotaciona a câmera, 2 dedos (pinça) controlam zoom in/out
const activePtrs=new Map();
let pinchDist0=0,pinchZoom0=1,lastSingleX=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePtrs.size===1){
    st.drag=1;
    lastSingleX=e.clientX;
  }else if(activePtrs.size===2){
    st.drag=0;
    const pts=[...activePtrs.values()];
    pinchDist0=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y)||1;
    pinchZoom0=st.zoom;
  }
});
cv.addEventListener('pointermove',e=>{
  if(!activePtrs.has(e.pointerId))return;
  activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePtrs.size===1&&st.drag){
    st.yaw+=(e.clientX-lastSingleX)*.6;
    st.tyaw=st.yaw;
    lastSingleX=e.clientX;
  }else if(activePtrs.size===2){
    const pts=[...activePtrs.values()];
    const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    if(pinchDist0>0){
      st.zoom=Math.min(2.5,Math.max(.6,pinchZoom0*(dist/pinchDist0)));
    }
  }
});
function endPtr(e){
  activePtrs.delete(e.pointerId);
  if(activePtrs.size===1){
    const rem=[...activePtrs.values()][0];
    st.drag=1;
    lastSingleX=rem.x;
  }else{
    st.drag=0;
    pinchDist0=0;
  }
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{st.zoom=Math.min(2.5,Math.max(.6,st.zoom-e.deltaY*.001))},{passive:true});
